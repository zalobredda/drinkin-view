<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14284B">
<meta name="color-scheme" content="light">
<meta name="description" content="Drink'In Livery: versión de prueba con datos de muestra.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drink'In">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
/* base que en el artifact pone el publicador: márgenes seguros del celular */
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Drink'In Livery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap">
<style>
/* Piel pastel (KaiD): una sola app, tinta azul marino, color de la ocasión, Anton + Space Mono + DM Sans, bordes de 2 px, sin sombras. Nunca amarillo. */
:root{
  --ink:#14284B; --bg:#F6F0E4; --card:#FFFCF5; --line:#E6DECF; --txt:#14284B; --ink2:#3E4E6C;
  --occ:#F4B9A7; --occd:#3B2620;
  --hdr:var(--occ); --hdrfg:#14284B;
  --brd:#14284B; --brd2:#14284B; --brdo:#14284B;
  --btn:var(--occ); --btnfg:#14284B;
  --inkbtn:#14284B; --inkbtnfg:#FFFCF5;
  --info:#D6CCF0; --infofg:#14284B;
  --bad:#E9B8D2; --badfg:#14284B;
  --warn:#F4B9A7; --warnfg:#14284B;
  --mint:#BFE5D6; --mintfg:#14284B; --gift:#1F6B55;
  --fd:"Anton",Impact,sans-serif; --fb:"DM Sans",system-ui,sans-serif; --fm:"Space Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151F; --card:#181D2B; --line:#3A4258; --txt:#EDE6D8; --ink2:#A7AFC2;
  --hdr:var(--occd); --hdrfg:var(--occ);
  --brd:#EDE6D8; --brd2:#3A4258; --brdo:var(--occ);
  --inkbtn:#EDE6D8; --inkbtnfg:#11151F;
  --info:#29243D; --infofg:#D6CCF0; --bad:#3A2232; --badfg:#E9B8D2;
  --warn:#3B2620; --warnfg:#F4B9A7; --mint:#1E3A33; --mintfg:#BFE5D6; --gift:#BFE5D6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151F; --card:#181D2B; --line:#3A4258; --txt:#EDE6D8; --ink2:#A7AFC2;
  --hdr:var(--occd); --hdrfg:var(--occ);
  --brd:#EDE6D8; --brd2:#3A4258; --brdo:var(--occ);
  --inkbtn:#EDE6D8; --inkbtnfg:#11151F;
  --info:#29243D; --infofg:#D6CCF0; --bad:#3A2232; --badfg:#E9B8D2;
  --warn:#3B2620; --warnfg:#F4B9A7; --mint:#1E3A33; --mintfg:#BFE5D6; --gift:#BFE5D6;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:15.5px/1.45 var(--fb);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--brdo);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;text-transform:uppercase;text-wrap:balance}
.app{max-width:520px;margin:0 auto;min-height:100vh}
.app.team{max-width:980px;padding:0 16px 60px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:13px}
.sp{height:10px}
/* encabezado de pantalla del cliente */
.hd{background:var(--hdr);color:var(--hdrfg);border-bottom:2px solid var(--brdo);padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.bk{align-self:flex-start;height:36px;padding:0 12px;border:2px solid currentColor;border-radius:99px;background:transparent;color:inherit;font:700 11.5px var(--fm);letter-spacing:.04em}
.ht{margin:6px 0 0;font:400 60px/.92 var(--fd);text-transform:uppercase;text-wrap:balance}
.ht.long{font-size:52px}
.hsub{font:700 12px var(--fm);letter-spacing:.04em;text-transform:uppercase}
.pg{padding:14px 16px 220px;display:flex;flex-direction:column;gap:12px}
.pg.done{padding-bottom:60px}
.sec{margin:8px 0 0;font:700 11.5px var(--fm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.help{margin:0;font-size:13px;line-height:1.4;color:var(--ink2)}
.help2{font-size:13px;line-height:1.4;color:var(--ink2)}
/* botones */
.btn{min-height:44px;border:2px solid var(--brd);background:var(--card);color:var(--txt);border-radius:99px;padding:0 18px;font:700 12.5px var(--fm);letter-spacing:.02em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.pri{background:var(--btn);color:var(--btnfg);border-color:var(--brdo)}
.btn.ink,.btn.navy{background:var(--inkbtn);color:var(--inkbtnfg)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:11.5px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.pbtn{margin-left:auto;height:52px;padding:0 20px;border:2px solid var(--brdo);border-radius:99px;background:var(--btn);color:var(--btnfg);font:700 13px var(--fm);letter-spacing:.02em;text-transform:uppercase}
.pbtn:disabled{opacity:.4}
.x{border:0;background:none;color:var(--txt);text-decoration:underline;font:700 11.5px var(--fm);padding:8px 6px;min-height:36px}
.link{background:none;border:0;padding:12px 0;text-decoration:underline;color:var(--ink2);font-size:13.5px}
.addb{width:100%;min-height:52px;border:0;border-top:2px solid var(--brd);background:transparent;color:var(--txt);font:700 13px var(--fm)}
/* chips y selectores */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.hz{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips.hz::-webkit-scrollbar{display:none}
.chips.hz>*{flex:none}
.chip{min-height:44px;padding:0 14px;border:2px solid var(--brd);border-radius:99px;background:transparent;color:var(--txt);font:500 14px var(--fb)}
.chip.on{background:var(--inkbtn);color:var(--inkbtnfg);border-color:var(--inkbtn)}
.chip.dash{border-style:dashed}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--brd);border-radius:99px;padding:3px}
.sg button{height:44px;border:none;border-radius:99px;background:transparent;color:var(--txt);font:700 13px var(--fm)}
.sg button.on{background:var(--inkbtn);color:var(--inkbtnfg)}
.gchip{align-self:flex-start;min-height:36px;padding:0 12px;border:0;border-radius:99px;background:var(--mint);color:var(--mintfg);font:500 13px var(--fb)}
.gpill{display:flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:99px;background:var(--mint);color:var(--mintfg);font-size:14px}
.ichip{align-self:flex-start;height:32px;padding:0 12px;border:0;border-radius:99px;background:var(--info);color:var(--infofg);font:700 11px var(--fm)}
/* avisos y etiquetas */
.note{border:2px solid var(--brd);border-radius:18px;background:var(--info);color:var(--infofg);padding:12px 14px;font:15px/1.45 var(--fb)}
.note.ok{background:var(--mint);color:var(--mintfg)}
.note.warn{background:var(--bad);color:var(--badfg)}
.tag{display:inline-block;font:700 10.5px var(--fm);letter-spacing:.05em;padding:3px 8px;border-radius:99px;background:var(--info);color:var(--infofg);text-transform:uppercase;vertical-align:middle}
.tag.acc{background:#14284B;color:#F4B9A7;box-shadow:inset 0 0 0 2px var(--brd)}
.tag.good{background:var(--mint);color:var(--mintfg)}
.tag.warn{background:var(--warn);color:var(--warnfg)}
.tag.bad{background:var(--bad);color:var(--badfg)}
/* bloques y filas */
.blk{--bbg:var(--boc,var(--hdr));--bfg:#14284B;border:2px solid var(--brd);border-radius:22px;background:var(--card);overflow:hidden}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .blk{--bbg:var(--bocd,var(--hdr));--bfg:var(--boc,var(--occ))}}
:root[data-theme="dark"] .blk{--bbg:var(--bocd,var(--hdr));--bfg:var(--boc,var(--occ))}
.blk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--bbg);color:var(--bfg);border-bottom:2px solid var(--brd)}
.blk-h b{font:400 22px/1 var(--fd);text-transform:uppercase}
.blk-h span{font:700 11px var(--fm)}
.blk-t{padding:12px 14px;border-bottom:2px solid var(--brd)}
.blk-t b{font:400 22px/1 var(--fd);text-transform:uppercase}
.rw{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
.rw.off{opacity:.6}
.rwm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rw .nm{font:700 15.5px/1.2 var(--fb)}
.rw .sb{font:400 12px var(--fm);text-transform:uppercase}
.rw .pr{font:700 14px var(--fm);white-space:nowrap}
.rwn{padding:10px 14px;font:400 12px var(--fm);color:var(--ink2);text-transform:uppercase}
.ph{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font:400 18px var(--fd);background:var(--line)}
.ph.tint{background:var(--bbg);color:var(--bfg);opacity:.6}
.qrow{display:flex;align-items:center;gap:8px}
.qs{display:inline-flex;align-items:center;border:2px solid var(--brd);border-radius:99px;height:36px;background:transparent}
.qs button{width:36px;height:32px;border:none;background:transparent;color:var(--txt);font-size:17px}
.qs button:disabled{opacity:.3}
.qs span{min-width:20px;text-align:center;font:700 13px var(--fm)}
.qs.big{height:48px}
.qs.big button{width:44px;height:44px;font-size:20px}
.qs.big span{min-width:52px;font-size:14px}
.perrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tl{display:flex;flex-direction:column;gap:6px;font-size:15px;padding:4px 4px 0}
.tl>div{display:flex;justify-content:space-between;gap:10px}
.tl .gf{color:var(--gift)}
.tl .big{font:400 28px/1 var(--fd);padding-top:8px;border-top:2px solid var(--brd);margin-top:4px;text-transform:uppercase}
/* turnos, barrios, envío */
.tn{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border:2px solid var(--brd2);border-radius:20px;background:transparent;color:var(--txt);text-align:left}
.tn b{font:400 32px/1 var(--fd)}
.tn .mm{flex:1;display:flex;flex-direction:column;gap:2px;font:14px/1.3 var(--fb)}
.tn .cu{font:700 11px var(--fm);text-transform:uppercase}
.tn .mk{font:700 18px var(--fm);min-width:14px}
.tn.on{background:var(--occ);color:#14284B;border-color:var(--brdo)}
.tn.full{opacity:.55;pointer-events:none}
.ship{border:2px solid var(--brd);border-radius:18px;background:var(--info);color:var(--infofg);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:14.5px/1.4 var(--fb)}
.ship.ok{background:var(--mint);color:var(--mintfg)}
.ship.bad{background:var(--bad);color:var(--badfg)}
.ship b{font:700 15px var(--fm);white-space:nowrap}
/* formulario */
label.f{display:block;margin:6px 0 4px;font:700 14px var(--fb)}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=search],select{width:100%;border:2px solid var(--brd);background:var(--card);color:var(--txt);border-radius:14px;padding:11px 12px;min-height:48px;font:16px var(--fb)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--info);color:var(--infofg);border:2px solid var(--brd)}
.chk input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--brd)}
.payr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.payr small{display:block;font:700 10.5px var(--fm);letter-spacing:.08em;color:var(--ink2)}
.payr b{word-break:break-all;font-size:14px}
.card{background:var(--card);border:2px solid var(--brd);border-radius:22px;padding:14px}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-variant-numeric:tabular-nums}
.tot .g{color:var(--gift);font-weight:700}
.tot .t{font:400 22px var(--fd);padding-top:6px;border-top:2px solid var(--brd);margin-top:4px;text-transform:uppercase}
/* barra fija de abajo */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--brdo);padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;position:relative}
.bar .t{display:flex;justify-content:space-between;gap:10px;font:700 11.5px var(--fm);text-transform:uppercase}
.bar .b{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--brdo);border-radius:6px;transition:width .3s}
.bar .go{display:flex;align-items:center;gap:12px}
.bar .tt{display:flex;flex-direction:column}
.bar .tt small{font:700 11px var(--fm)}
.bar .tt b{font:400 28px/1 var(--fd)}
.bar .why{font-size:13px;line-height:1.4;color:var(--ink2)}
.undo{position:absolute;left:0;right:0;bottom:calc(100% + 12px);height:48px;border-radius:99px;background:#14284B;color:#FFFCF5;box-shadow:inset 0 0 0 2px var(--brd);display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 18px;font-size:14px}
.undo button{height:38px;padding:0 14px;border:none;border-radius:99px;background:#BFE5D6;color:#14284B;font:700 12px var(--fm)}
/* hojas */
.ov{position:fixed;inset:0;background:#000a;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);color:var(--txt);width:100%;max-width:520px;max-height:88vh;overflow:auto;border:2px solid var(--brd);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font:400 22px/1 var(--fd);text-transform:uppercase;margin-bottom:12px}
/* confirmación */
.code{display:inline-block;background:#14284B;color:#F4B9A7;padding:8px 14px;border-radius:14px;font:700 24px var(--fm);letter-spacing:.06em;box-shadow:inset 0 0 0 2px var(--brd)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--inkbtn);color:var(--inkbtnfg);padding:10px 16px;border-radius:99px;z-index:60;font-size:14px;max-width:90vw;border:2px solid var(--brd)}
.toast.bad{background:var(--bad);color:var(--badfg)}
.ban{margin:10px 16px 0;padding:10px 14px;border-radius:18px;background:var(--info);color:var(--infofg);font-size:14px;border:2px solid var(--brd)}
/* equipo */
.top{display:flex;justify-content:space-between;align-items:center;padding-top:14px;gap:8px}
.brand{font:700 12px var(--fm);letter-spacing:.08em}
.pill{height:36px;padding:0 14px;border:2px solid var(--brd);border-radius:99px;background:transparent;color:var(--txt);font:700 11.5px var(--fm);letter-spacing:.04em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:44px;border:2px solid var(--brd);background:transparent;color:var(--txt);border-radius:99px;padding:0 16px;font:700 12px var(--fm);text-transform:uppercase}
.tabs button.on{background:var(--inkbtn);color:var(--inkbtnfg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.kpi{border:2px solid var(--brd);border-radius:18px;padding:12px;background:var(--mint);color:var(--mintfg)}
.kpi:nth-child(2){background:var(--info);color:var(--infofg)}
.kpi:nth-child(3){background:var(--warn);color:var(--warnfg)}
.kpi:nth-child(4){background:var(--card);color:var(--txt)}
.kpi small{display:block;font:700 10.5px var(--fm);letter-spacing:.08em;text-transform:uppercase}
.kpi b{font:400 28px/1.1 var(--fd)}
.shift{margin:18px 0 6px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--brd);padding-bottom:4px}
.shift h3{font:400 32px/1 var(--fd)}
.shift .cupo{font:700 12px var(--fm);text-transform:uppercase}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-top:10px}
.cmd{background:var(--card);border:2px solid var(--brd);border-radius:22px;padding:12px;position:relative}
.cmd.s-entregado{opacity:.65}
.cmd .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cmd .h b{font:700 15px var(--fm)}
.cmd ul{margin:8px 0;padding:0;list-style:none;font-size:14px}
.cmd li{display:flex;gap:8px}.cmd li span:first-child{font:700 12.5px var(--fm);min-width:26px}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.sts a{display:flex;align-items:center;justify-content:center;min-height:44px;text-align:center;text-decoration:none;border:2px solid var(--brd);border-radius:99px;padding:0 4px;font:700 12px var(--fm);text-transform:uppercase;background:var(--card)}
.sts a.on{background:#14284B;color:#FFFCF5}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:700 10.5px var(--fm);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:8px;border-bottom:2px solid var(--brd);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl input{padding:7px 8px;min-height:40px;border-radius:12px;width:100%;min-width:76px}
.scr{overflow-x:auto;border:2px solid var(--brd);border-radius:18px;background:var(--card)}
.hbar{height:10px;border-radius:6px;background:var(--brd);min-width:2px}
.hbar.g{background:var(--gift)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
input[type=range]{width:100%;accent-color:var(--brd);min-height:36px}
.res{font:400 56px/1 var(--fd)}
.stkc{display:inline-flex;align-items:center;gap:4px}
.stkc input{width:72px;text-align:right}
.qb{width:36px;height:36px;border:2px solid var(--brd);border-radius:50%;background:transparent;color:var(--txt);font-size:16px}
.acc{border:2px solid var(--brd);border-radius:22px;background:var(--card);margin-top:12px;overflow:hidden}
.acc summary{list-style:none;cursor:pointer;padding:14px;font:400 22px/1 var(--fd);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font:700 18px var(--fm)}
.acc[open] summary::after{content:"−"}
.acc[open] summary{border-bottom:2px solid var(--brd)}
.accb{padding:12px 14px 14px}

/* portada de dos estilos y estilo "La carta" (más de 35) */
.pt{position:fixed;inset:0;z-index:10;display:grid;grid-template-columns:1fr 1fr;background:#F6F0E4;font-family:'DM Sans',system-ui,sans-serif}
.pt-h{display:block;min-width:0;border:0;border-radius:0;margin:0;padding:calc(env(safe-area-inset-top,0px) + 130px) 18px calc(env(safe-area-inset-bottom,0px) + 40px);color:#14284B;text-align:left;cursor:pointer}
.pt-l{background:#F4B9A7}
.pt-r{background:#F6F0E4;border-left:1px solid #14284B}
.pt-in{display:flex;flex-direction:column;align-items:stretch;gap:14px;height:100%;width:100%;max-width:300px;margin:0 auto}
.pt-in>span{display:block}
.pt-tag{align-self:flex-start;font:400 24px/1 'Anton',Impact,sans-serif;background:#14284B;color:#F4B9A7;padding:6px 10px;border-radius:8px;text-transform:uppercase}
.pt-tag.r{font:500 20px/1.1 'DM Sans',system-ui,sans-serif;background:transparent;color:#14284B;border:1.5px solid #14284B;text-transform:none}
.pt-t{font:400 44px/.92 'Anton',Impact,sans-serif;text-transform:uppercase}
.pt-t.r{font:300 40px/1 'DM Sans',system-ui,sans-serif;letter-spacing:-.03em;text-transform:none}
.pt-t span{display:block}
.pt-s{font:500 14px/1.4 'DM Sans',system-ui,sans-serif}
.pt-s.r{font-weight:400;color:#3E4E6C}
.pt-b{margin-top:auto;height:50px;border-radius:99px;display:flex!important;align-items:center;justify-content:center;background:#14284B;color:#F6F0E4;font:700 15px 'DM Sans',system-ui,sans-serif}
.pt-b.r{background:transparent;border:1.5px solid #14284B;color:#14284B;font-weight:500}
.pt-seal{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 52px);width:60px;height:60px;padding:0;border:0;border-radius:50%;background:none;z-index:2}
.cz{padding:56px 28px 190px}
.cz-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cz-seal{width:40px;height:40px;padding:0;border:0;border-radius:50%;background:none}
.cz-hoy{font:700 11px var(--fm);letter-spacing:.14em;text-transform:uppercase;text-align:right}
.cz-lbl{margin:34px 0 0;font:700 11px var(--fm);letter-spacing:.14em;color:var(--ink2)}
.cz-h1{margin:10px 0 22px;font:400 34px/1.1 var(--fb);letter-spacing:-.02em;text-transform:none}
.cz-list{border-bottom:1px solid var(--line)}
.cz-row{display:grid;grid-template-columns:10px 1fr auto;gap:14px;align-items:center;width:100%;min-height:64px;padding:16px 0;border:0;border-top:1px solid var(--line);background:transparent;color:var(--txt);text-align:left}
.cz-row:disabled{opacity:.5}
.cz-dot{display:block;width:10px;height:10px;border-radius:50%}
.cz-dot.mine{background:transparent;border:1.5px solid var(--txt)}
.cz-n{display:block;font:400 20px/1.2 var(--fb)}
.cz-m{display:block;margin-top:2px;font:400 13px/1.3 var(--fb);color:var(--ink2)}
.cz-ar{font:300 22px var(--fb)}
.cz-lnk{margin-top:22px;padding:12px 0;border:0;background:none;color:var(--ink2);font:13px var(--fb);text-decoration:underline}
.co-hd{padding:52px 28px 22px;border-bottom:1px solid var(--line)}
.co-back{padding:6px 0;min-height:44px;border:0;background:none;color:var(--txt);font:500 14px var(--fb)}
.co-occ{display:flex;align-items:center;gap:8px;margin-top:6px;font:700 11px var(--fm);letter-spacing:.14em}
.co-occ i{display:block;width:14px;height:14px;border-radius:50%;background:var(--occ)}
.co-name{margin:10px 0 18px;font:300 44px/1.02 var(--fb);letter-spacing:-.03em;text-transform:none}
.co-per{display:flex;align-items:center;justify-content:space-between;gap:12px;font:400 15px var(--fb)}
.co-st{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 3px;border:1.5px solid var(--txt);border-radius:99px}
.co-st button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--txt);font-size:20px}
.co-st button:disabled{opacity:.3}
.co-st span{min-width:32px;text-align:center;font:500 17px var(--fb)}
.co-main{padding:22px 28px 220px}
.co-lbl{font:700 11px var(--fm);letter-spacing:.14em;color:var(--ink2)}
.co-cb{display:grid;grid-template-columns:22px 1fr auto;gap:14px;align-items:start;width:100%;margin-top:0;padding:18px 0;border:0;border-top:1px solid var(--line);background:transparent;color:var(--txt);text-align:left}
.co-cb:disabled{opacity:.5}
.co-rad{display:grid;place-items:center;width:20px;height:20px;margin-top:2px;border:1.5px solid var(--txt);border-radius:50%}
.co-cb[aria-checked="true"] .co-rad::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--txt)}
.co-cn{display:block;font:500 18px/1.25 var(--fb)}
.co-cd{display:block;margin-top:3px;font:400 14px/1.4 var(--fb);color:var(--ink2)}
.co-cp{font:400 16px var(--fb);white-space:nowrap}
.co-note{margin:0;padding-top:14px;border-top:1px solid var(--line);font:13px/1.45 var(--fb);color:var(--ink2)}
.cz-dock{position:fixed;left:0;right:0;bottom:0;z-index:20}
.cz-dock.solo{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.cz-pill{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 32px);max-width:488px;height:48px;margin:0 auto 10px;padding:0 18px;border:0;border-radius:99px;background:var(--inkbtn);color:var(--inkbtnfg);font:500 14px var(--fb)}
.cz-pill:disabled{cursor:default}
.cz-bar{background:var(--bg);border-top:1px solid var(--brd);padding:14px 22px calc(30px + env(safe-area-inset-bottom,0px))}
.cz-bar-in{display:flex;align-items:center;gap:12px;max-width:476px;margin:0 auto}
.cz-bt{flex:1;min-width:0}
.cz-bt small{display:block;font:13px var(--fb);color:var(--ink2)}
.cz-bt b{font:500 22px var(--fb)}
.cz-add{height:52px;padding:0 22px;border:2px solid var(--brdo);border-radius:99px;background:var(--occ);color:#14284B;font:500 16px var(--fb)}
.cz-add:disabled{opacity:.4}
body:has(.cz-dock) .toast{bottom:calc(215px + env(safe-area-inset-bottom,0px))}
.hlnk{align-self:flex-start;padding:8px 0;border:0;background:none;color:var(--ink);font:12px 'DM Sans',system-ui,sans-serif;text-decoration:underline}
/* panel del equipo v2 (dos pieles) y app del rider */
.app.team{max-width:none;padding:0}
.tp{--sec:#F6F0E4;--card:#FFFCF5;--line:#E6DECF;--brd:#14284B;--brdo:#14284B;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:var(--sec);color:#14284B}
.tp[data-skin="joven"]{--card:#fff;--line:#14284B}
.tp[data-skin="joven"][data-sec="noche"]{--sec:#B49CF0}
.tp[data-skin="joven"][data-sec="stock"]{--sec:#9CD37F}
.tp[data-skin="joven"][data-sec="margen"]{--sec:#8FB0EE}
.tp[data-skin="joven"][data-sec="equilibrio"]{--sec:#F2A08E}
.tp[data-skin="joven"][data-sec="clientes"]{--sec:#F09BC8}
.tp[data-skin="joven"][data-sec="ajustes"]{--sec:#7FD6C0}
.tp-nav{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:#FFFCF5;border-right:1px solid #E6DECF;overflow-y:auto}
.tp[data-skin="joven"] .tp-nav{background:#fff;border-right:2px solid #14284B}
.tp-brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;font:700 11px var(--fm);letter-spacing:.14em}
.tp-out{display:flex;align-items:center;justify-content:center;min-height:40px;margin:0 0 8px;padding:0 14px;border:2px solid #14284B;border-radius:99px;background:transparent;color:#14284B;font:700 11.5px var(--fm);letter-spacing:.06em;white-space:nowrap}
.tp-it{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:0;border-radius:99px;background:transparent;color:#14284B;font:700 12px var(--fm);letter-spacing:.06em;text-transform:uppercase;text-align:left;white-space:nowrap}
.tp-it small{font:400 11px var(--fb);letter-spacing:0;text-transform:none;color:#3E4E6C}
.tp-it.on{background:#14284B;color:#fff}
.tp-it.on small{color:#D6CCF0}
.tp-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid #E6DECF;font:14px/1.4 var(--fb)}
.tp[data-skin="joven"] .tp-foot{border-top:2px solid #14284B}
.tp-foot button{padding:6px 0;border:0;background:none;color:#14284B;font:13px var(--fb);text-decoration:underline}
.tp-main{min-width:0;padding:26px 28px 70px}
.tp-top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.tp-kick{font:700 11px var(--fm);letter-spacing:.12em;text-transform:uppercase}
.tp-h{margin:4px 0 0;font:400 56px/.95 var(--fd);text-transform:uppercase;letter-spacing:0}
.tp[data-skin="mas35"] .tp-h{font:300 48px/1.02 var(--fb);letter-spacing:-.03em;text-transform:none}
.tp-note{font:15px var(--fb)}
.tp-hn{opacity:.55}
.pst{display:inline-flex;align-items:center;gap:4px}
.pst input{width:92px;min-width:0;text-align:right;-moz-appearance:textfield;appearance:textfield}
.pst input::-webkit-outer-spin-button,.pst input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2px 14px;align-items:end}
.fc{min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.tp-brand b{display:block;font:700 14px var(--fm);letter-spacing:.1em}
.tp-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tp-who{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border:2px solid #14284B;border-radius:99px;background:#14284B;color:#fff;font:700 11.5px var(--fm);letter-spacing:.06em;text-transform:uppercase}
.tp[data-skin="mas35"] .scr,.tp[data-skin="mas35"] .acc,.tp[data-skin="mas35"] .cmd,.tp[data-skin="mas35"] .kpi{border:1px solid #E6DECF;border-radius:16px}
.tp[data-skin="mas35"] h2,.tp[data-skin="mas35"] h3,.tp[data-skin="mas35"] .kpi b,.tp[data-skin="mas35"] .shift h3,.tp[data-skin="mas35"] .acc summary,.tp[data-skin="mas35"] .res{font-family:var(--fb);font-weight:300;text-transform:none;letter-spacing:-.02em}
.tp[data-skin="mas35"] .btn.ink,.tp[data-skin="mas35"] .btn.pri{background:#F4B9A7;color:#14284B;border-color:#14284B}
.tp[data-skin="mas35"] .chip.on,.tp[data-skin="mas35"] .tabs button.on{background:#14284B;color:#fff}
.tp[data-skin="joven"] .kpi:nth-child(n){border:2px solid #14284B}
.tp .help,.tp .muted{color:#3E4E6C}
.tp .tbl th{border-bottom:2px solid #14284B}
.tp[data-skin="mas35"] .tbl th{border-bottom:1px solid #E6DECF}
.tp[data-skin="mas35"] .tbl td{border-bottom:1px solid #E6DECF}
/* Noche */
.tn-tabs{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none}
.tn-tabs::-webkit-scrollbar{display:none}
.tn-tab{flex:none;padding:4px 0 8px;border:0;border-bottom:3px solid transparent;background:none;color:#3E4E6C;text-align:left}
.tn-tab b{display:block;font:400 26px/1 var(--fd);text-transform:uppercase}
.tp[data-skin="mas35"] .tn-tab b{font:300 26px/1.1 var(--fb);text-transform:none;letter-spacing:-.02em}
.tn-tab small{display:block;font:400 12px var(--fb)}
.tn-tab.on{color:#14284B;border-bottom-color:#14284B}
.tn-wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr);gap:16px;margin-top:16px;align-items:start}
.tn-list{overflow:hidden;background:var(--card);border:2px solid #14284B;border-radius:22px}
.tp[data-skin="mas35"] .tn-list,.tp[data-skin="mas35"] .tn-fi{border:1px solid #E6DECF;border-radius:16px}
.tn-hd,.tn-r{display:grid;grid-template-columns:1.6fr 1fr .6fr .9fr 1.1fr;gap:10px;align-items:center;width:100%;padding:12px 16px;text-align:left}
.tn-hd{font:700 10.5px var(--fm);letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid #14284B;padding-top:14px;padding-bottom:12px}
.tp[data-skin="mas35"] .tn-hd{border-bottom:1px solid #E6DECF}
.tn-r{min-height:60px;border:0;border-bottom:1px solid var(--line);background:transparent;color:#14284B}
.tp[data-skin="joven"] .tn-r{border-bottom:1px solid #14284B}
.tn-r:last-child{border-bottom:0}
.tn-r.on{background:var(--oc)}
.tn-r.done{opacity:.55}
.tn-c{display:flex;align-items:center;gap:10px;min-width:0}
.tn-c>span{min-width:0}
.tn-c b,.tn-c small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn-c b{font:700 15px var(--fb)}
.tn-c small{font:400 12px var(--fb);color:#3E4E6C}
.tn-dot{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid #14284B;background:var(--oc)}
.tn-b,.tn-t,.tn-m{font:700 13px var(--fm)}
.tp[data-skin="mas35"] .tn-b,.tp[data-skin="mas35"] .tn-t,.tp[data-skin="mas35"] .tn-m{font:400 14px var(--fb)}
.tn-m{text-align:right}
.tn-e b{display:block;font:700 13px var(--fm)}
.tp[data-skin="mas35"] .tn-e b{font:500 14px var(--fb)}
.tn-e small{display:block;font:400 12px var(--fb);color:#3E4E6C}
.tn-empty{padding:28px 18px;color:#3E4E6C}
.tn-fi{display:flex;flex-direction:column;overflow:hidden;background:var(--fc,var(--card));border:2px solid #14284B;border-radius:22px}
.tn-fb{padding:16px 18px 6px}
.tn-fk{font:700 11px var(--fm);letter-spacing:.1em;text-transform:uppercase}
.tn-fn{margin:6px 0 2px;font:400 36px/1 var(--fd);text-transform:uppercase}
.tp[data-skin="mas35"] .tn-fn{font:300 34px/1.05 var(--fb);text-transform:none;letter-spacing:-.02em}
.tn-fr{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid #14284B;font:14px/1.35 var(--fb)}
.tp[data-skin="mas35"] .tn-fr{border-top:1px solid #E6DECF}
.tn-fr>span:last-child{text-align:right;font-weight:500}
.tn-fa{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px 16px;border-top:2px solid #14284B}
.tp[data-skin="mas35"] .tn-fa{border-top:1px solid #E6DECF}
.tn-fa .btn{flex:1 1 auto}
.tn-av{margin:10px 18px 0;padding:10px 12px;border:2px solid #14284B;border-radius:16px;background:#D6CCF0;font:13.5px/1.4 var(--fb)}
.tn-av.bad{background:#E9B8D2}
.tn-av a{font-weight:700}
.tn-lk{padding:4px 0 2px;border:0;background:none;color:#14284B;font:12px var(--fb);text-decoration:underline}
.qr-box{display:grid;place-items:center;padding:8px 0}
.qr-box svg{width:min(260px,70vw);height:auto;border:2px solid #14284B;border-radius:12px;background:#fff}
@media (max-width:820px){
  .tp{display:block}
  .tp-nav{position:static;height:auto;flex-direction:row;align-items:center;gap:4px;overflow-x:auto;padding:10px 10px;border-right:0;border-bottom:1px solid #E6DECF;scrollbar-width:none}
  .tp[data-skin="joven"] .tp-nav{border-bottom:2px solid #14284B}
  .tp-brand{padding:0 6px 0 2px;flex:none}
  .tp-brand span{display:none}
  .tp-out{flex:none;margin:0 6px 0 0;min-height:40px}
  .tp-it{flex:none;min-height:40px;padding:0 12px}
  .tp-it small{display:none}
  .tp-foot{margin:0 0 0 auto;padding:0 4px;border:0!important;flex:none}
  .tp-foot span{display:none}
  .tp-main{padding:18px 14px 70px}
  .tp-h{font-size:42px}
  .tp[data-skin="mas35"] .tp-h{font-size:38px}
  .tn-wrap{grid-template-columns:minmax(0,1fr)}
  .tn-hd,.tn-r{grid-template-columns:1.8fr .6fr .9fr 1.2fr;padding:10px 12px}
  .tn-b,.tn-hd>span:nth-child(2){display:none}
}
/* app del rider */
.rd{min-height:100vh;background:var(--rbg,#B49CF0);color:#14284B;font-family:var(--fb);transition:background .25s}
.rd-in{position:relative;display:flex;flex-direction:column;max-width:430px;min-height:100vh;margin:0 auto}
.rd-sc{flex:1;display:flex;flex-direction:column;gap:16px;padding:58px 20px 24px}
.rd-lbl{font:700 11px var(--fm);letter-spacing:.1em;text-transform:uppercase}
.rd-big{margin:0;padding-top:.08em;font:400 60px/.9 var(--fd);text-transform:uppercase;letter-spacing:0}
.rd-p{margin:0;font:500 15px/1.45 var(--fb)}
.rd-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rd-pill{padding:9px 13px;border:2px solid currentColor;border-radius:99px;background:transparent;color:inherit;font:700 11px var(--fm);letter-spacing:.04em;text-transform:uppercase}
.rd-pill.fill{background:#14284B;color:#fff;border-color:#14284B}
.rd-foot{position:sticky;bottom:0;padding:14px 20px calc(26px + env(safe-area-inset-bottom,0px));border-top:2px solid #14284B;background:var(--rfoot,transparent)}
.rd-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:60px;border:2px solid #14284B;border-radius:99px;background:#14284B;color:#fff;font:700 14px var(--fm);letter-spacing:.04em;text-transform:uppercase;text-align:center}
.rd-cta.ghost{background:#fff;color:#14284B;margin-bottom:10px;height:52px}
.rd-cta:disabled{opacity:.45}
.rd-pin{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rd-pin span{display:grid;place-items:center;height:72px;border:2px solid #14284B;border-radius:20px;background:#fff;font:400 40px var(--fd)}
.rd-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rd-keys button{height:52px;border:0;border-radius:99px;background:rgba(255,255,255,.55);color:#14284B;font:500 22px var(--fb)}
.rd-err{padding:10px 14px;border:2px solid #14284B;border-radius:16px;background:#E9B8D2;font:500 14px var(--fb)}
.rd-grp{display:flex;flex-direction:column;gap:10px}
.rd-gh{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:6px;border-bottom:2px solid #14284B}
.rd-gh b{font:400 30px/1 var(--fd);text-transform:uppercase}
.rd-gh span{font:700 11px var(--fm)}
.rd-card{display:block;width:100%;overflow:hidden;border:2px solid #14284B;border-radius:24px;background:#fff;color:#14284B;text-align:left}
.rd-card.dim{opacity:.55}
.rd-ch{display:flex;justify-content:space-between;gap:8px;padding:10px 16px;border-bottom:2px solid #14284B;background:var(--oc,#fff);font:700 12px var(--fm)}
.rd-cb{display:flex;flex-direction:column;gap:4px;padding:12px 16px}
.rd-cb b{font:400 28px/1 var(--fd);text-transform:uppercase}
.rd-cb span{font:500 15px var(--fb)}
.rd-cb small{font:400 14px var(--fb);color:#3E4E6C}
.rd-box{display:flex;flex-direction:column;gap:12px;padding:16px;border:2px solid #14284B;border-radius:24px;background:#fff}
.rd-box.col{background:var(--oc,#fff)}
.rd-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rd-btn{display:grid;place-items:center;height:48px;border:2px solid #14284B;border-radius:99px;background:transparent;color:#14284B;font:700 12px var(--fm);text-decoration:none;text-transform:uppercase}
.rd-btn.ink{background:#14284B;color:#fff}
.rd-it{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid #E6DECF;font:500 15px var(--fb)}
.rd-ok{padding:5px 11px;border:2px solid #14284B;border-radius:99px;background:#9CD37F;font:700 11px var(--fm)}
.rd-ok.no{background:#F4B9A7}
.rd-circle{display:grid;place-items:center;width:100px;height:100px;border:2px solid #14284B;border-radius:50%;background:#fff;font:400 44px/1 var(--fd)}
.rd-dark{color:#fff}
.rd-dark .rd-pill{color:#fff}
.rd-scan{position:relative;align-self:center;width:220px;height:220px;overflow:hidden;border-radius:28px;background:#2B3E66;border:0;color:#fff;font:700 11px var(--fm)}
.rd-scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rd-scan i{position:absolute;width:44px;height:44px;border:4px solid #8FB0EE}
.rd-scan i:nth-of-type(1){left:18px;top:18px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}
.rd-scan i:nth-of-type(2){right:18px;top:18px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.rd-scan i:nth-of-type(3){left:18px;bottom:18px;border-right:0;border-top:0;border-radius:0 0 0 12px}
.rd-scan i:nth-of-type(4){right:18px;bottom:18px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.rd-scan span{position:absolute;left:0;right:0;bottom:30px;text-align:center}
.rd-chips{display:flex;flex-wrap:wrap;gap:8px}
.rd-chips span{padding:9px 13px;border:2px solid #8FB0EE;border-radius:99px;font:700 11px var(--fm);text-transform:uppercase}
.rd-chips span.on{background:#8FB0EE;color:#14284B}
.rd-man{display:flex;gap:10px}
.rd-man input{flex:1;min-width:0;height:56px;padding:0 20px;border:2px solid #14284B;border-radius:99px;background:#fff;color:#14284B;font:400 28px var(--fd)}
.rd-man button{flex:none;width:56px;height:56px;border:0;border-radius:50%;background:#8FB0EE;color:#14284B;font:700 13px var(--fm)}

/* ===== diseño KD v27: Gestión, estados, ensayo y celular ===== */
.tp{--card:#FFFCF5;--bd:1px solid #E6DECF;--rad:16px;--info:#BFD6EC;--poco:#F4B9A7;--bad:#E9B8D2;--ok:#BFE5D6;--vio:#D6CCF0;--regfg:#BFD6EC;--mut:#3E4E6C;--skel:#EFE7D8;--hl:#14284B}
.tp[data-skin="joven"]{--card:#fff;--bd:2px solid #14284B;--rad:22px;--info:#8FB0EE;--poco:#F2A08E;--bad:#F09BC8;--ok:#9CD37F;--vio:#B49CF0;--regfg:#fff;--skel:#E8EDF7}
.tp[data-skin="joven"][data-sec="noche"],.tp[data-skin="joven"][data-sec="compras"],.tp[data-skin="joven"][data-sec="cierre"]{--sec:#B49CF0}
.tp[data-skin="joven"][data-sec="stock"],.tp[data-skin="joven"][data-sec="historial"]{--sec:#9CD37F}
.tp[data-skin="joven"][data-sec="precios"],.tp[data-skin="joven"][data-sec="facturas"]{--sec:#8FB0EE}
.tp[data-skin="joven"][data-sec="equilibrio"],.tp[data-skin="joven"][data-sec="riders"]{--sec:#F2A08E}
.tp[data-skin="joven"][data-sec="gastos"],.tp[data-skin="joven"][data-sec="ensayo"],.tp[data-skin="joven"][data-sec="clientes"]{--sec:#F09BC8}
.tp[data-skin="joven"][data-sec="caja"],.tp[data-skin="joven"][data-sec="ajustes"]{--sec:#7FD6C0}
/* menú */
.tp{grid-template-columns:232px minmax(0,1fr)}
.tp-nav{padding:18px 12px;gap:0;background:var(--sec0,#F6F0E4);border-right:1px solid #E6DECF}
.tp[data-skin="joven"] .tp-nav{background:#fff;border-right:2px solid #14284B}
.nv-top{display:flex;align-items:center;gap:10px;padding:0 6px 10px}
.nv-who{flex:1;min-width:0;font:700 10px/1.3 var(--fm);letter-spacing:.1em;text-transform:uppercase}
.nv-who b{display:block;font:400 15px/1.3 var(--fb);letter-spacing:0;text-transform:none}
.nv-who .w2{display:none}
.nv-out{flex:none;min-height:34px;padding:0 12px;border:1.5px solid #14284B;border-radius:99px;background:transparent;color:#14284B;font:700 10.5px var(--fm);letter-spacing:.06em}
.nv-g{padding:16px 12px 4px;font:700 10px var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.nv-it{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#14284B;font:400 15px var(--fb);text-align:left}
.nv-it.on{background:#FFFCF5}
.nv-it .nl-s{display:none}
.tp[data-skin="joven"] .nv-it{border-radius:99px;font:700 11.5px var(--fm);letter-spacing:.05em;text-transform:uppercase}
.tp[data-skin="joven"] .nv-it.on{background:#14284B;color:#fff}
.nv-c{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border:1px solid #14284B;border-radius:99px;background:var(--poco);color:#14284B;font:700 11px/1 var(--fb);font-style:normal;letter-spacing:0}
.nv-c.c-info{background:var(--info)}.nv-c.c-bad{background:var(--bad)}.nv-c.c-poco{background:var(--poco)}
.tp-foot{display:none}
/* título */
.tp-main{padding:24px 26px 90px}
.tp-top{align-items:flex-end;gap:18px;margin-bottom:16px}
.tp-kick{font:700 11px var(--fm);letter-spacing:.14em;text-transform:uppercase}
.tp .tp-h{margin:6px 0 0;font:300 36px/1.05 var(--fb);letter-spacing:-.02em;text-transform:none}
.tp[data-skin="joven"] .tp-h{font:400 52px/.92 var(--fd);letter-spacing:0;text-transform:uppercase}
.tp-cost{display:flex;gap:10px;align-items:baseline;margin:0 0 14px;padding:8px 12px;border:1px dashed currentColor;border-radius:10px;font:13px/1.4 var(--fb);opacity:.85}.tp-cost b{font:700 10px var(--fm);letter-spacing:.12em;flex:none}
.tp-note{max-width:360px;text-align:right;font:14px/1.4 var(--fb)}
/* cuadros con significado */
.tp .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0 0 14px}
.tp[data-skin] .kpis .kpi{background:var(--card);color:#14284B;border:var(--bd);border-radius:var(--rad);padding:16px 18px;min-height:112px}
.tp .kpi small{display:block;font:700 10.5px var(--fm);letter-spacing:.1em;text-transform:uppercase}
.tp .kpi b{display:block;margin-top:8px;font:300 32px/1 var(--fb);letter-spacing:-.02em;text-transform:none}
.tp[data-skin="joven"] .kpi b{font:400 38px/1 var(--fd);letter-spacing:0}
.tp .kpi span{display:block;margin-top:8px;font:13px/1.35 var(--fb)}
.tp[data-skin] .kpis .kpi.k-info{background:var(--info)}
.tp[data-skin] .kpis .kpi.k-poco{background:var(--poco)}
.tp[data-skin] .kpis .kpi.k-bad{background:var(--bad)}
.tp[data-skin] .kpis .kpi.k-ok{background:var(--ok)}
.tp[data-skin] .kpis .kpi.k-vio{background:var(--vio)}
.tp[data-skin] .kpis .kpi.k-reg{background:#14284B;color:var(--regfg)}
/* tarjetas, listas y fichas */
.pn{background:var(--card);border:var(--bd);border-radius:var(--rad);overflow:hidden;margin-bottom:14px}
.pn-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 18px 8px;font:700 10.5px var(--fm);letter-spacing:.1em;text-transform:uppercase}
.pn-h em{font:400 13px var(--fb);letter-spacing:0;text-transform:none;font-style:normal;color:var(--mut)}
.pn-b{padding:6px 18px 18px}
.pn .tbl th{padding:8px 18px}
.pn .tbl td{padding:12px 18px}
.tp .scr{background:var(--card);border:var(--bd);border-radius:var(--rad);overflow-x:auto}
.tp[data-skin="mas35"] .scr,.tp[data-skin="mas35"] .card{border:var(--bd);border-radius:var(--rad)}
.tp .card{background:var(--card);border:var(--bd);border-radius:var(--rad)}
.tp .sec{margin:18px 0 8px;font:700 10.5px var(--fm);letter-spacing:.1em;text-transform:uppercase;color:#14284B}
.ly{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.ly.full{grid-template-columns:minmax(0,1fr)}
.fi{background:var(--card);border:var(--bd);border-radius:var(--rad);overflow:hidden;margin-bottom:14px}
.fi-b{padding:18px}
.fi-k{font:700 10.5px var(--fm);letter-spacing:.1em;text-transform:uppercase}
.fi-t{margin:8px 0 6px;font:300 26px/1.1 var(--fb);letter-spacing:-.01em}
.tp[data-skin="joven"] .fi-t{font:400 30px/.95 var(--fd);text-transform:uppercase;letter-spacing:0}
.fi-s{font:14px/1.4 var(--fb);color:var(--mut)}
.fr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-top:var(--bd);font:14px/1.35 var(--fb)}
.fr>span:last-child{text-align:right}
.fi-f{padding:14px 18px 18px;border-top:var(--bd)}
.fi-f .btn{width:100%}
.fi.navy{background:#14284B;color:#fff;border-color:#14284B}
.fi.navy .fi-s,.fi.navy .help{color:#BFD6EC}
/* etiquetas con significado */
.tp .tag{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border:1px solid #14284B;border-radius:99px;background:transparent;color:#14284B;font:500 12px/1 var(--fb);letter-spacing:0;text-transform:none;white-space:nowrap}
.tp[data-skin="joven"] .tag{border-width:1.5px;font:700 10.5px/1 var(--fm);letter-spacing:.05em;text-transform:uppercase}
.tp .tag.good{background:var(--ok);color:#14284B}.tp .tag.warn{background:var(--poco);color:#14284B}.tp .tag.bad{background:var(--bad);color:#14284B}
.tp .tag.pv{background:var(--info);color:#14284B}.tp .tag.vg{background:#14284B;color:var(--regfg);box-shadow:none}.tp .tag.acc{background:var(--vio);color:#14284B;box-shadow:none}
.tp .tag.out{background:transparent;opacity:.75}
tr.dia td{border-top:1px solid rgba(20,40,75,.15)}tr.dia:hover td{background:rgba(143,176,238,.18)}tr.rea td{background:var(--info,#eef3fb);border-top:2px solid currentColor}tr.hij td:first-child{border-left:3px solid var(--navy,#1b2a49)}tr.anul td{opacity:.6}tr.anul .st-t{text-decoration:line-through}
/* foto cuadrada y nombre de producto */
.pfoto{flex:none;display:inline-grid;place-items:center;width:48px;height:48px;border:1px dashed #3E4E6C;border-radius:10px;background:#F6F0E4;color:#3E4E6C;font:700 8.5px var(--fm);letter-spacing:.06em}
.tp[data-skin="joven"] .pfoto{border:1.5px dashed #14284B;border-radius:12px;background:#fff;color:#14284B}
.pnm{display:flex;align-items:center;gap:12px;min-width:0}
.pnm b{display:block;font:500 15px/1.25 var(--fb)}
.tp[data-skin="joven"] .pnm b{font-weight:700}
.pnm small{display:block;font:13px/1.3 var(--fb);color:var(--mut)}
/* botones: todo lo tocable de 44 px como mínimo */
.tp .btn,.tp .btn.sm,.tp .chip,.tp .x{min-height:44px}
.tp .btn.sm{padding:0 16px}
.tp .btn.ink,.tp .btn.pri{background:#F4B9A7;color:#14284B;border:2px solid #14284B}
.tp[data-skin="joven"] .btn.ink,.tp[data-skin="joven"] .btn.pri{background:#14284B;color:#fff;border-color:#14284B}
.tp .qb{width:44px;height:44px;border:2px solid #14284B;border-radius:50%;background:transparent;color:#14284B;font-size:20px;line-height:1;flex:none}
.tp .qb.pl{background:#14284B;color:#fff}
.tp .stkc,.tp .pst{display:inline-flex;align-items:center;gap:8px}
.tp .stkc input,.tp .pst input{width:84px;min-width:0;text-align:center;border:0;background:transparent;font:500 16px var(--fb);-moz-appearance:textfield;appearance:textfield;padding:0}
.tp .pst input::-webkit-outer-spin-button,.tp .pst input::-webkit-inner-spin-button,.tp .stkc input::-webkit-outer-spin-button,.tp .stkc input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tp[data-skin="joven"] .stkc input,.tp[data-skin="joven"] .pst input{font:400 20px var(--fd)}
.rbar{display:block;width:100%;height:8px;margin-top:6px;border-radius:4px;background:#F1EADC}
.tp[data-skin="joven"] .rbar{background:#fff;border:1.5px solid #14284B;height:10px}
.rbar i{display:block;height:100%;border-radius:4px;background:var(--ok)}.rbar i.lo{background:var(--bad)}
/* estados: vacío, cargando, sin conexión, error al guardar */
.empty{padding:26px 22px}
.empty h3{font:300 26px/1.1 var(--fb);letter-spacing:-.01em}
.tp[data-skin="joven"] .empty h3{font:400 30px/.95 var(--fd);text-transform:uppercase;letter-spacing:0}
.empty p{max-width:440px;margin:8px 0 14px;font:15px/1.45 var(--fb);color:var(--mut)}
.skr{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:var(--bd)}
.skp{flex:none;width:48px;height:48px;border-radius:10px;background:var(--skel);animation:skel 1.4s ease-in-out infinite}
.skl{flex:1;display:grid;gap:8px}
.skl i{display:block;height:10px;border-radius:5px;background:var(--skel);animation:skel 1.4s ease-in-out infinite}
.skl i:first-child{width:70%}.skl i:last-child{width:45%}
@keyframes skel{0%,100%{opacity:1}50%{opacity:.45}}
.offl{display:flex;gap:10px;align-items:baseline;margin:0 0 12px;padding:10px 14px;border:var(--bd);border-radius:12px;background:var(--info);font:14px/1.4 var(--fb)}
.offl b{flex:none;font:700 10.5px var(--fm);letter-spacing:.1em}
.errbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:75;display:flex;align-items:center;gap:14px;width:min(760px,calc(100% - 24px));padding:12px 16px;border:2px solid #14284B;border-radius:18px;background:#F09BC8;color:#14284B}
.errbar>div{flex:1;min-width:0;font:14px/1.35 var(--fb)}.errbar b{display:block;font:700 12px var(--fm);letter-spacing:.04em;text-transform:uppercase}
.errbar .btn{min-height:44px;background:#14284B;color:#fff;border-color:#14284B}
.errbar .x{min-height:44px}
/* modo ensayo: franja azul marino y marco rosa en toda la pantalla, igual en las dos pieles */
#ens{position:fixed;top:0;left:0;right:0;z-index:70}
.ens-in{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 22px;background:#14284B;color:#fff}

.tp tr.sel td{background:rgba(20,40,75,.06)}
.tp .tn-lk{display:inline-flex;align-items:center;min-height:44px;padding:0;border:0;background:none;color:#14284B;font:13px var(--fb);text-decoration:underline}
.tn-av{margin:0 0 10px;padding:12px 14px;border:var(--bd);border-radius:14px;background:var(--vio);font:13.5px/1.4 var(--fb)}
.tn-av.bad{background:var(--bad)}
.tp .tbl td.r,.tp .tbl th.r{text-align:right}

.scanrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.scan{flex:1;min-width:240px;display:flex;align-items:center;gap:14px;min-height:56px;padding:0 22px;border:var(--bd);border-radius:99px;background:var(--card)}
.scan span{flex:none;font:700 10.5px var(--fm);letter-spacing:.1em}
.scan input{flex:1;min-width:0;min-height:50px;padding:0;border:0;background:transparent;font:16px var(--fb);outline:0}
.tp .fi label.small{display:block}
.tp .fi input[type=text],.tp .fi input[type=number],.tp .fi input[type=date],.tp .fi select{min-height:44px}

.chart{position:relative;display:flex;align-items:flex-end;gap:8px;height:210px;padding:10px 4px 22px;margin-top:4px}
.chart-b{position:relative;flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.chart-b b{display:block;width:100%;max-width:34px;border-radius:6px 6px 0 0;background:var(--info);border:1px solid #14284B;border-bottom:0}
.tp[data-skin="joven"] .chart-b b{border-width:1.5px;border-radius:8px 8px 0 0}
.chart-b b.lo{background:var(--bad)}
.chart-b small{position:absolute;bottom:-18px;font:700 10px var(--fm);color:var(--mut)}
.chart-line{position:absolute;left:0;right:0;height:0;border-top:2px dashed #14284B;z-index:2;pointer-events:none}
.chart-line em{position:absolute;right:0;top:-18px;font:700 10px var(--fm);font-style:normal;letter-spacing:.08em;text-transform:uppercase;background:var(--card);padding:0 4px}
.nv-who{white-space:nowrap;letter-spacing:.06em}
.tp select#g_ci\.d{max-width:340px}

.tp[data-skin="joven"] .chip{font:700 11.5px var(--fm);letter-spacing:.04em;text-transform:uppercase}
@media (max-width:820px){.tp tr.sel td{background:none}.tp tr.sel{background:rgba(20,40,75,.06)}}
.stk-wrap .stk{zoom:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* inicio Historias (5a) */
html.hs-on,html.hs-on body{overflow:hidden;height:100%;overscroll-behavior:none}
.hs{position:fixed;inset:0;z-index:10;overflow:hidden;font-family:'Space Mono',ui-monospace,monospace;background:#111}
.hs button{-webkit-tap-highlight-color:transparent}
.hs-scroll{position:absolute;inset:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
.hs-scroll::-webkit-scrollbar{display:none}
.hsl{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:calc(env(safe-area-inset-top,0px) + 76px) 22px calc(env(safe-area-inset-bottom,0px) + 92px);background:var(--bg);color:var(--ink)}
.hsin{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.hnum{font:700 12px 'Space Mono',monospace;letter-spacing:.06em;white-space:pre}
.htitle{margin:0;padding-top:.08em;flex:none;font:400 var(--size)/.92 'Anton',Impact,sans-serif;text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
.hcombos{display:flex;gap:6px;flex-wrap:wrap}
.hcombo{height:36px;padding:0 12px;border:2px solid var(--ink);border-radius:99px;background:transparent;color:var(--ink);font:700 11.5px 'Space Mono',monospace;letter-spacing:.04em}
.hcombo[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hcombo:disabled{opacity:.4}
.hlines{flex:1 0 auto;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.hlines span{font:400 26px/1.15 'Anton',Impact,sans-serif;text-transform:uppercase;opacity:.9}
.hrow{display:flex;align-items:center;gap:10px}
.hstep{display:flex;align-items:center;border:2px solid var(--ink);border-radius:99px;height:48px}
.hstep button{width:44px;height:44px;border:none;background:transparent;color:var(--ink);font-size:20px}
.hppl{font:700 14px 'Space Mono',monospace;min-width:52px;text-align:center}
.hprice{font:700 15px 'Space Mono',monospace}
.hadd{margin-left:auto;width:64px;height:64px;flex:none;border-radius:50%;border:2px solid var(--ink);background:var(--ink);color:var(--bg);font:400 32px/1 'Anton',Impact,sans-serif;transition:background .15s,color .15s}
.hadd[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.hadd.nostock{font:700 11px/1.1 'Space Mono',monospace;opacity:.6}
.hmine{height:48px;padding:0 18px;border:2px solid var(--ink);border-radius:99px;background:var(--ink);color:var(--bg);font:700 13px 'Space Mono',monospace}
.htop{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 0;pointer-events:none;color:var(--cur-ink,#111);transition:color .2s}
.htop-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.hsegs{display:flex;gap:4px}
.hsegs i{flex:1;height:3px;border-radius:2px;background:currentColor;opacity:.3;transition:opacity .2s}
.hsegs i.on{opacity:1}
.hbrand{display:flex;justify-content:space-between;align-items:center;font:700 12px 'Space Mono',monospace;letter-spacing:.04em}
.hlogo{pointer-events:auto;display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 8px 6px 0;margin:-6px 0;color:inherit;font:700 12px 'Space Mono',monospace;letter-spacing:.04em}
.hpill{position:absolute;left:50%;transform:translateX(-50%);width:calc(100% - 36px);max-width:484px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);height:48px;border:none;border-radius:99px;background:var(--cur-ink,#111);color:var(--cur-bg,#fff);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font:700 12.5px 'Space Mono',monospace;transition:background .2s,color .2s}
.hpill:disabled{cursor:default}

const chain={};
function q(path,fn){const p=(chain[path]||Promise.resolve()).catch(()=>{}).then(fn);chain[path]=p;return p}
function mirror(path,data){const a=path.split('/'),m=COLMAP[a[0]];if(!m)return;if(a[0]==='config'){R.cfg=data;return}if(data===null)delete R[m][a[1]];else R[m][a[1]]=data}
function localApply(path,data){mirror(path,data);rebuild();softRender()}
function dbSet(path,data){
  return q(pp(path),async()=>{
    for(let i=0;i<4;i++){
      try{ if(DB){await DB.doc(pp(path)).set(data);mirror(path,data);if(/^(products|config)\//.test(path))rebuild()}else localApply(path,data); return }
      catch(e){ if(i<3&&e&&(e.code==='unavailable'||e.code==='resource_exhausted')){await new Promise(r=>setTimeout(r,700*(i+1)));continue} throw e }
    }
  });
}
function dbDel(path){return q(pp(path),async()=>{if(DB){await DB.doc(pp(path)).delete();mirror(path,null)}else localApply(path,null)})}
async function guard(fn,msg){
  try{await fn();if(S.saveErr){S.saveErr=null;errBar()}return true}
  catch(e){
    const code=e&&(e.code||e.message),rule=e&&(e.code==='cerrada'||e.code==='sin-stock');
    const detail=e&&e.code==='cerrada'?'Esa noche está cerrada: no se edita.':e&&e.code==='sin-stock'?'No hay tanto stock.':(msg||'No se pudo guardar. Revisá que estés conectado y con permiso.')+(code?' ('+code+')':'');
    console.error(e);
    if(S.view==='team'&&!rule){S.saveErr={detail:detail,fn:fn};errBar()}else toast(detail,true);
    return false;
  }
}
function errBar(){
  const el=$('#err');if(!el)return;
  el.innerHTML=S.saveErr?`<div class="errbar" role="alert"><div><b>No se guardó el cambio</b>${esc(S.saveErr.detail)}</div><button class="btn" data-act="retry">REINTENTAR</button><button class="x" data-act="errx" aria-label="Cerrar el aviso">✕</button></div>`:'';
}

function turnoInfo(fecha){
  const now=ART();
  return C.turnos.map(t=>{
    const used=Object.values(R.orders).filter(o=>o.fecha===fecha&&o.turno===t.h&&o.estado!=='anulado').length;
    const left=Math.max(0,t.cupo-used);
    const closed=fecha<now.date||(fecha===now.date&&now.min>=toMin(t.cierre));
    return Object.assign({},t,{used:used,left:left,closed:closed,full:!closed&&left===0});
  });
}

function hsUpdate(){
  const root=$('#hs');if(!root)return;
  const ids=hsList(),idx=Math.max(0,Math.min(S.hsIdx,ids.length-1)),col=HS_COL[ids[idx]];
  root.style.setProperty('--cur-bg',col[0]);root.style.setProperty('--cur-ink',col[1]);
  root.querySelectorAll('.hsegs i').forEach((x,k)=>x.classList.toggle('on',k===idx));
  root.querySelectorAll('.hsl').forEach(el=>{
    const o=OCC.find(x=>x.id===el.dataset.id);if(!o)return;
    const n=hsPpl(o),k=hsCombo(o),ok=hsOk(o),on=!!S.hs.added[o.id];
    el.querySelectorAll('.hcombo').forEach((b,j)=>{b.setAttribute('aria-pressed',String(ok&&j===k));b.disabled=!comboOk(o,o.combos[j],n)});
    const it=hsItems(o),vg=vasosGift(it,n,P,C,false);
    el.querySelector('.hlines').innerHTML=it.map(i=>`<span>${esc(short(i.c))}${i.q>1?' ×'+i.q:''}</span>`).join('')+(vg&&avail(vg.c)?`<span>${vg.u} vasos de regalo</span>`:'');
    el.querySelector('.hppl').textContent=n+' pers';
    el.querySelector('.hprice').textContent=money(hsPrice(o));
    const add=el.querySelector('.hadd');
    add.disabled=!ok;add.classList.toggle('nostock',!ok);
    add.textContent=!ok?'SIN STOCK':on?'✓':'+';
    add.setAttribute('aria-pressed',String(ok&&on));add.setAttribute('aria-label',on?'Quitar caja':'Sumar caja');
  });
  const tot=hsTotal(),min=C.minimo,pill=root.querySelector('.hpill');
  pill.disabled=tot<min;
  $('#hpl').textContent='PEDIDO '+money(tot);
  $('#hpr').textContent=tot>=min?'ELEGIR ENTREGA →':'MÍN '+money(min)+' · FALTAN '+money(min-tot);
}
function mountHome(){
  const sc=$('#hsc');if(!sc)return;

// Pasa las cajas sumadas al pedido actual. Lo que el cliente ya había agregado aparte se conserva.
function hsToCart(){
  const old={};S.cart.items.forEach(i=>{const e=i.q-(i.b||0);if(e>0)old[i.c]=e});
  const boxes=[],m={};
  OCC.forEach(o=>{
    if(!S.hs.added[o.id])return;
    const n=hsPpl(o),cb=o.combos[hsCombo(o)];
    if(!comboOk(o,cb,n)){delete S.hs.added[o.id];toast(o.n+': ese combo se agotó por hoy');return}
    const it=comboScaled(o,cb,n);
    if(it.some(i=>(m[i.c]||0)+i.q>P[i.c].s)){delete S.hs.added[o.id];toast(o.n+': no alcanza el stock para sumar esa caja');return}
    it.forEach(i=>m[i.c]=(m[i.c]||0)+i.q);
    boxes.push({occ:o.id,combo:cb.id,per:n});
  });
  const items=Object.keys(m).map(c=>({c:c,q:m[c]+(old[c]||0),b:m[c]}));
  Object.keys(old).forEach(c=>{if(!(c in m))items.push({c:c,q:old[c],b:0})});
  S.cart={occ:boxes.length?(boxes.length===1?boxes[0].occ:'multi'):'scratch',per:boxes.reduce((a,x)=>a+x.per,0)||2,budget:null,items:items,combo:boxes.length?boxes[0].combo:null,boxes:boxes};
}
function cartLabel(){
  const bx=S.cart.boxes||[];if(!bx.length)return 'A tu medida';
  return bx.map(x=>{const o=OCC.find(y=>y.id===x.occ);return o.n+' · '+o.combos.find(y=>y.id===x.combo).n}).join(' + ');
}

/* ---------- acciones del cliente ---------- */
function setItems(items){S.cart.items=items}
function addItem(c,d){
  const it=S.cart.items.find(i=>i.c===c),stock=P[c].s;
  if(it){const n=it.q+d;if(n<(it.b||0))return;if(n<=0){S.cart.items=S.cart.items.filter(i=>i!==it)}else if(n>stock||(d>0&&P[c].off)){toast('No queda más de '+P[c].n);return}else it.q=n}
  else if(d>0){if(stock<=0||P[c].off){toast('Agotado por hoy');return}S.cart.items.push({c:c,q:1,b:0})}
}
async function confirmOrder(){
  if(S.placing)return;
  const e=formErrors();if(e.length)return;
  S.placing=true;renderBar();
  const c=calc(),f=S.form,t=turnoInfo(S.deliv.fecha).find(x=>x.h===S.deliv.turno);
  if(!t||t.closed||t.left<=0){S.placing=false;const nx=nextFree(S.deliv.fecha,S.deliv.turno);S.deliv.offer={next:nx&&nx.h};S.deliv.turno=null;go('deliv');return}
  const tel=f.tel.trim(),id=digits(tel),prev=R.cust[id],n=(prev?prev.pedidos:0)+1;
  const o={code:nextCode(),qt:newToken(),fecha:S.deliv.fecha,turno:S.deliv.turno,nombre:f.nombre.trim(),tel:tel,barrio:S.deliv.barrio,dir:f.dir.trim(),pago:f.pago,
    sub:c.sub,desc:c.desc,merc:c.merc,envio:c.envio,envioTipo:c.zone.t,total:c.total,items:c.items,estado:'recibido',n:n,
    regalos:gAlways()?[Object.assign({},gAlways())]:[],
    regalo:giftOn()?{c:C.regaloAnticipo,n:P[C.regaloAnticipo].n,q:1,k:P[C.regaloAnticipo].k}:null,
    occ:cartLabel(),personas:(S.cart.boxes||[]).length?S.cart.per:0,ts:Date.now(),gift:false,mayor:true};
  o.cobro={est:o.pago==='mercadopago'?'confirmado':'pendiente',ts:o.ts};o.fact={est:'sin emitir'};
  const ded={};o.items.forEach(l=>ded[l.c]=(ded[l.c]||0)+l.q);if(o.regalo)ded[o.regalo.c]=(ded[o.regalo.c]||0)+1;o.regalos.forEach(g=>ded[g.c]=(ded[g.c]||0)+g.q);
  const plans={};Object.keys(ded).forEach(c=>{if(P[c])plans[c]=planConsume(c,Math.min(ded[c],P[c].s))});
  o.items=o.items.map(l=>plans[l.c]&&plans[l.c].q?Object.assign({},l,{kr:Math.round(plans[l.c].avg)}):l);
  o.cons=Object.keys(plans).filter(c=>plans[c].q).map(c=>({c:c,p:compactParts(plans[c])}));
  let saved=false;
  try{
    if(DB){for(let k=0;k<6;k++){const ex=await DB.doc(pp('orders/'+o.code)).get();if(!ex.exists)break;o.code='DL-'+String((+o.code.slice(3))+1).padStart(4,'0')}}
    await dbSet('orders/'+o.code,o);saved=true;
    for(const c in plans){await applyPlan(plans[c]).catch(()=>{})}
    await dbSet('customers/'+id,{nombre:o.nombre,tel:tel,barrio:o.barrio,pedidos:n,ultimo:o.ts}).catch(()=>{});
  }catch(err){console.error(err)}
  if(saved)lsSet('dk-cli',JSON.stringify({nombre:o.nombre,tel:o.tel,dir:o.dir}));
  S.placing=false;S.done={order:o,saved:saved};go('done');
}

    case 'hsc':S.hs.combo[d.id]=+d.k;hsUpdate();break;
    case 'hsp':{const o=OCC.find(x=>x.id===d.id);S.hs.ppl[d.id]=Math.max(1,Math.min(30,hsPpl(o)+(+d.d)));hsUpdate();break}

function tryPin(v){
  v=String(v);

  if(pe){setRole(pe.admin?'admin':'equipo',pe.n);logChange('sesion','Entró al panel',[],{noUndo:true});return 'team'}

async function loadPrefs(){

function newToken(){const a=new Uint8Array(12);(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.random()*256)}).getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,20)}
S.tok={};
function tokenFor(o){
  if(o.qt)return o.qt;
  if(!S.tok[o.code]){S.tok[o.code]=newToken();guard(()=>patchOrder(o.code,{qt:S.tok[o.code]}))}
  return S.tok[o.code];
}
const qrPayload=o=>APP_URL+'?o='+o.code+'&t='+tokenFor(o);
function qrSvg(text){
  try{
    const q=qrcode(0,'M');q.addData(text);q.make();
    const n=q.getModuleCount();let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+4)+' '+(r+4)+'h1v1h-1z';
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+8} ${n+8}" role="img" aria-label="Código QR del pedido"><rect width="${n+8}" height="${n+8}" fill="#fff"/><path d="${d}" fill="#000" shape-rendering="crispEdges"/></svg>`;
  }catch(e){return '<p class="help">No se pudo dibujar el QR.</p>'}
}
// actualización parcial de un pedido (no pisa lo que cambió otro)
function patchOrder(code,patch,opt){
  return q(pp('orders/'+code),async()=>{
    const cur=R.orders[code];if(!cur)throw new Error('sin pedido');
    if(isClosed(cur.fecha)&&!(opt&&opt.late))throw Object.assign(new Error('noche cerrada'),{code:'cerrada'});
    const next=Object.assign({},cur,patch);
    for(let i=0;i<4;i++){
      try{
        if(DB)await DB.doc(pp('orders/'+code)).set(next);else localApply('orders/'+code,next);
        R.orders[code]=next;return;
      }catch(e){
        if(i<3&&e&&(e.code==='unavailable'||e.code==='resource_exhausted')){await new Promise(r=>setTimeout(r,700*(i+1)));continue}
        throw e;
      }
    }
  });
}
/* ----- lectura de QR: cámara, foto o código a mano ----- */
let camStream=null,camTimer=null;
function stopCam(){clearTimeout(camTimer);camTimer=null;if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}}
function parseQR(raw){
  const s=String(raw||'').trim();
  const c=s.match(/DL-?\s*(\d{1,6})/i)||(/^\d{1,6}$/.test(s)?[null,s]:null);
  const t=s.match(/[?&]t=([a-z0-9]+)/i);
  return{code:c?'DL-'+String(c[1]).padStart(4,'0'):null,tok:t?t[1]:null};
}
async function camStart(video,onCode){
  stopCam();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  camStream=st;video.srcObject=st;video.setAttribute('playsinline','');video.muted=true;await video.play();
  let det=null;try{if('BarcodeDetector' in window)det=new BarcodeDetector({formats:['qr_code']})}catch(e){}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  let last='',lastT=0;
  const tick=async()=>{
    if(!camStream)return;
    try{
      if(video.readyState>=2&&video.videoWidth){
        let val=null;
        if(det){const r=await det.detect(video);if(r&&r[0])val=r[0].rawValue}
        else if(window.jsQR){
          const w=Math.min(640,video.videoWidth),h=Math.round(video.videoHeight*w/video.videoWidth);
          cv.width=w;cv.height=h;cx.drawImage(video,0,0,w,h);
          const id=cx.getImageData(0,0,w,h),r=jsQR(id.data,w,h);if(r)val=r.data;
        }
        if(val&&(val!==last||Date.now()-lastT>3000)){last=val;lastT=Date.now();onCode(val)}
      }
    }catch(e){}
    if(camStream)camTimer=setTimeout(tick,det?180:250);
  };
  tick();
}
async function decodeFile(file){
  const bmp=await createImageBitmap(file);
  try{if('BarcodeDetector' in window){const r=await new BarcodeDetector({formats:['qr_code']}).detect(bmp);if(r&&r[0])return r[0].rawValue}}catch(e){}
  const sc=Math.min(1,1400/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(bmp,0,0,w,h);
  const id=cx.getImageData(0,0,w,h),r=window.jsQR&&jsQR(id.data,w,h);
  return r?r.data:null;
}

async function rdHandle(raw,manual){
  const {code,tok}=parseQR(raw),o=code&&R.orders[code],scr=S.rd.scr;
  if(!o)return rdMsg('No encontré ese pedido.',true);
  if(!manual&&o.qt&&tok!==o.qt)return rdMsg('Ese sticker no es válido.',true);
  if(scr==='entrega'){
    if(code!==S.rd.sel)return rdMsg('Ese sticker es de otro pedido ('+code+').',true);
    stopCam();S.rd.dni=false;S.rd.err='';S.rd.scr='dni';render();return;
  }
  if(o.rider&&o.rider!==S.who)return rdMsg('Ese pedido está asignado a otro rider.',true);
  if(o.estado==='camino'&&o.rider===S.who)return rdMsg(code+' ya estaba cargado.');
  if(o.estado==='entregado'||o.estado==='problema')return rdMsg(code+' ya figura como '+estTxt(o).toLowerCase()+'.',true);
  if(o.estado==='recibido')return rdMsg(code+' todavía tiene el pago por confirmar. Avisá en la base.',true);
  try{await patchOrder(code,{estado:'camino',rider:S.who,tRetiro:Date.now()})}catch(e){return rdMsg('No se pudo guardar. ¿Tenés permiso para editar?',true)}
  if(!S.rd.nuevos.includes(code))S.rd.nuevos.push(code);
  const mine=rdMine().filter(x=>['preparando','recibido','camino'].includes(x.estado));
  rdMsg('Cargado: '+code+' · '+first(o.nombre));
  // la lista se actualiza cuando llega el cambio de la base; la reflejamos ya
  R.orders[code]=Object.assign({},R.orders[code],{estado:'camino',rider:S.who});rdPartial();
}
async function rdSalirBase(){
  stopCam();
  const route=rdRoute(),total=route.length,ts=Date.now();
  for(const code of S.rd.nuevos){
    const o=R.orders[code];if(!o)continue;
    const pos=Math.max(1,route.findIndex(x=>x.code===code)+1);
    const avisos=(o.avisos||[]).concat([{k:'salio',txt:`Hola, ${first(o.nombre)}. Tu pedido ${code} salió de la base. Sos el ${pos}.º de ${total} en el recorrido. Te avisamos cuando estemos cerca.`,ts:ts,env:false}]);
    if(pos===1)avisos.push({k:'llega',txt:first(o.nombre)+', tu pedido llega en unos minutos.',ts:ts,env:false});
    await guard(()=>patchOrder(code,{avisos:avisos,ruta:{pos:pos,total:total}}));
  }
  S.rd.nuevos=[];S.rd.scr='camino';render();
}
async function rdAvisoLlega(code){
  const o=R.orders[code];if(!o||(o.avisos||[]).some(a=>a.k==='llega'))return false;
  await guard(()=>patchOrder(code,{avisos:(o.avisos||[]).concat([{k:'llega',txt:first(o.nombre)+', tu pedido llega en unos minutos.',ts:Date.now(),env:false}])}));
  return true;
}
async function rdEntregar(){
  const code=S.rd.sel,o=R.orders[code];if(!o)return;
  const ts=Date.now();
  try{await patchOrder(code,{estado:'entregado',tEntrega:ts,dni:true,ruta:null})}catch(e){return toast('No se pudo guardar. ¿Tenés permiso para editar?',true)}
  R.orders[code]=Object.assign({},R.orders[code],{estado:'entregado'});
  const rest=rdRoute().filter(x=>x.code!==code);
  for(let i=0;i<rest.length;i++)await guard(()=>patchOrder(rest[i].code,{ruta:{pos:i+1,total:rest.length}}));
  if(rest.length)await rdAvisoLlega(rest[0].code);
  S.rd.scr='entregado';render();
}

    case 'rdentregar':rdEntregar();return true;
  }
  return false;
}

const today=()=>ART().date;

function seedLocal(st){makeSeed(ART().date).forEach(d=>{const a=d.path.split('/'),m=COLMAP[a[0]];if(a[0]==='config')st.cfg=d.data;else st[m][a[1]]=d.data})}

/* --- lotes y costo (método: vencimiento primero; si no hay, el más antiguo) --- */
function lotsOf(c){
  const real=Object.values(R.lots).filter(l=>l.c===c&&l.q>0),p=P[c];
  const rest=Math.max(0,(p?p.s:0)-sumBy(real,l=>l.q));
  const arr=real.slice();
  if(rest>0)arr.push({id:'_ini:'+c,c:c,q:rest,q0:rest,k:p?p.k:0,exp:null,ts:0,virt:true});
  return arr;
}
function fefo(a){
  const t=today();
  return a.slice().sort((x,y)=>{
    const xv=!!(x.exp&&x.exp<t),yv=!!(y.exp&&y.exp<t);
    if(xv!==yv)return xv?1:-1;
    if(!!x.exp!==!!y.exp)return x.exp?-1:1;
    if(x.exp&&y.exp&&x.exp!==y.exp)return x.exp<y.exp?-1:1;
    return (x.ts||0)-(y.ts||0);
  });
}
function planConsume(c,q,pref){
  const p=P[c]||{k:0},L=fefo(lotsOf(c));
  if(pref){const i=L.findIndex(l=>l.id===pref);if(i>0)L.unshift(L.splice(i,1)[0])}
  let left=q,cost=0;const parts=[];
  for(const l of L){if(left<=0)break;const t=Math.min(l.q,left);parts.push({id:l.id,virt:!!l.virt,q:t,k:l.k,lot:l});cost+=t*l.k;left-=t}
  if(left>0){cost+=left*(p.k||0);parts.push({id:'_x',virt:true,q:left,k:p.k||0})}
  return{c:c,q:q,cost:cost,avg:q?cost/q:0,parts:parts};
}
async function applyPlan(plan){
  for(const pt of plan.parts){
    if(pt.virt)continue;
    const nq=pt.lot.q-pt.q;
    if(nq<=0)await dbDel('lots/'+pt.id);else await dbSet('lots/'+pt.id,Object.assign({},R.lots[pt.id]||pt.lot,{q:nq}));
  }
  await dbSet('products/'+plan.c,Object.assign({},P[plan.c],{s:Math.max(0,(P[plan.c].s||0)-plan.q)}));
}
function lastCost(c){
  let best=null;
  Object.values(R.compras).forEach(cp=>(cp.items||[]).forEach(i=>{if(i.c===c){const key=cp.fecha+'|'+String(cp.ts).padStart(15,'0');if(!best||key>best.key)best={key:key,k:i.k}}}));
  return best?best.k:(P[c]?P[c].k:0);
}
async function stockMove(c,delta,o){
  o=o||{};const p=P[c];if(!p)throw new Error('sin producto');
  const antes=p.s||0;let costo=0,avg=0,parts=null;
  if(delta>0){
    avg=o.k!=null?+o.k:lastCost(c);costo=avg*delta;
    const id=newId('lt'),lot={id:id,c:c,q:delta,q0:delta,k:avg,exp:o.exp||null,ts:Date.now(),fecha:today(),ref:o.ref||null,tipo:o.tipo||'llegada'};
    await dbSet('lots/'+id,lot);
    await dbSet('products/'+c,Object.assign({},P[c],{s:antes+delta}));
  }else if(delta<0){
    const n=-delta;
    if(n>antes)throw Object.assign(new Error('no hay tanto stock'),{code:'sin-stock'});
    const plan=planConsume(c,n,o.lot);costo=plan.cost;avg=plan.avg;parts=compactParts(plan);
    await applyPlan(plan);
  }else return null;
  const mv={id:newId('mv'),ts:Date.now(),fecha:today(),c:c,d:delta,tipo:o.tipo||'ajuste',motivo:o.motivo||'',ref:o.ref||null,k:Math.round(avg),costo:Math.round(costo),by:me(),antes:antes,despues:P[c].s};
  if(delta<0&&parts)mv.parts=parts;
  await dbSet('moves/'+mv.id,mv).catch(()=>{});
  if(!o.nolog)await logChange('stock',(delta>0?'Sumó ':'Sacó ')+Math.abs(delta)+' de '+p.n+(o.motivo?' · '+o.motivo:''),[{k:'stock',c:c,dv:delta,kc:Math.round(avg)}],{noUndo:!!o.noundo});
  return mv;
}


/* --- pedidos: de qué lotes salió cada producto, anulación y regalo de onda --- */
function compactParts(plan){
  return plan.parts.map(pt=>{const l=pt.lot||{};return{id:pt.id,v:pt.virt?1:0,q:pt.q,k:pt.k,exp:l.exp||null,ts:l.ts||0,fecha:l.fecha||null,ref:l.ref||null,tipo:l.tipo||null,q0:l.q0||pt.q}});
}
function consOf(o){
  if(o.cons&&o.cons.length)return o.cons;
  const m={};
  (o.items||[]).forEach(i=>m[i.c]=(m[i.c]||0)+i.q);
  if(o.regalo)m[o.regalo.c]=(m[o.regalo.c]||0)+(+o.regalo.q||1);
  (o.regalos||[]).forEach(g=>m[g.c]=(m[g.c]||0)+(+g.q||0));
  return Object.keys(m).map(c=>({c:c,p:[{id:'_x',v:1,q:m[c],k:(P[c]||{}).k||0,exp:null,ts:0,fecha:null,ref:null,tipo:null,q0:m[c]}]}));
}
async function restoreParts(c,parts){
  if(!P[c])return 0;
  let total=0;
  for(const pt of parts){
    total+=pt.q;
    if(pt.v)continue;                       // lote inicial o sin lote: alcanza con sumar al stock
    const cur=R.lots[pt.id];
    if(cur)await dbSet('lots/'+pt.id,Object.assign({},cur,{q:cur.q+pt.q}));
    else await dbSet('lots/'+pt.id,{id:pt.id,c:c,q:pt.q,q0:pt.q0||pt.q,k:pt.k,exp:pt.exp||null,ts:pt.ts||Date.now(),fecha:pt.fecha||today(),ref:pt.ref||null,tipo:pt.tipo||'devuelto'});
  }
  await dbSet('products/'+c,Object.assign({},P[c],{s:(P[c].s||0)+total}));
  return total;
}

function logChange(tipo,label,ops,extra){
  const id=newId('cg');
  const rp=reapAbierta(),g=rp&&tipo!=='reapertura'&&!(extra&&extra.grp)?{grp:rp.id}:{};
  return dbSet('cambios/'+id,Object.assign({id:id,ts:Date.now(),by:me(),tipo:tipo,label:label,ops:ops||[]},g,extra||{})).catch(e=>console.error(e));
}
async function undoChange(id){
  const cg=R.cambios[id];if(!cg||cg.undone||cg.noUndo||!(cg.ops||[]).length)return;
  for(const op of cg.ops){
    if(op.k==='set'){const cur=(P[op.p.split('/')[1]]||{})[op.f];if(cur!==op.d){toast('Ese valor ya cambió después. Corregilo a mano.',true);return}}
    if(op.k==='cfg'){if(JSON.stringify(getPath(C,op.f))!==JSON.stringify(op.d)){toast('Ese valor ya cambió después. Corregilo a mano.',true);return}}
    if(op.k==='stock'&&op.dv>0&&(P[op.c].s||0)<op.dv){toast('Parte de ese stock ya salió. Ajustalo a mano.',true);return}
    if(op.k==='compra'&&R.compras[op.id]){toast('Esa compra ya existe de nuevo.',true);return}
    if(op.k==='rider'){const r=(C.riders||[]).find(x=>x.id===op.id);if(!r||!!r.baja!==op.d){toast('Ese rider ya cambió después.',true);return}}
    if(op.k==='order'){const o=R.orders[op.code];if(!o||JSON.stringify(o[op.f])!==JSON.stringify(op.d)){toast('Ese pedido ya cambió después.',true);return}}
    if(op.k==='doc'&&op.d===null&&op.a!==null&&R[COLMAP[op.p.split('/')[0]]][op.p.split('/')[1]]){toast('Eso ya existe de nuevo.',true);return}
  }
  const ok=await guard(async()=>{
    for(const op of cg.ops.slice().reverse()){
      if(op.k==='set'){const c=op.p.split('/')[1];await dbSet(op.p,Object.assign({},P[c],{[op.f]:op.a}))}
      else if(op.k==='cfg'){const cl=JSON.parse(JSON.stringify(C));setPath(cl,op.f,op.a);await dbSet('config/main',cl)}
      else if(op.k==='stock'){await stockMove(op.c,-op.dv,{tipo:'deshacer',motivo:'deshacer un cambio',k:op.kc,nolog:true})}
      else if(op.k==='compra'){const cp=Object.assign({},op.a,{foto:false});await dbSet('compras/'+op.id,cp);for(const i of cp.items)await stockMove(i.c,+i.q,{tipo:'compra',k:i.k,exp:i.exp,ref:op.id,motivo:cp.prov,nolog:true})}
      else if(op.k==='rider'){const rs=JSON.parse(JSON.stringify(C.riders||[])),r=rs.find(x=>x.id===op.id);r[op.f]=op.a;await dbSet('config/main',Object.assign({},C,{riders:rs}))}
      else if(op.k==='order'){await patchOrder(op.code,{[op.f]:op.a},{late:true})}
      else if(op.k==='doc'){if(op.a===null)await dbDel(op.p);else await dbSet(op.p,op.a)}
    }
    await dbSet('cambios/'+id,Object.assign({},cg,{undone:true,undoneBy:me(),undoneTs:Date.now()}));
    await logChange('deshacer','Deshizo: '+cg.label,[],{ref:id,noUndo:true});
  });
  if(ok)toast('Deshecho');
}

const weekKey=d=>{const x=new Date(d+'T12:00:00Z'),dow=(x.getUTCDay()+6)%7;x.setUTCDate(x.getUTCDate()-dow);return x.toISOString().slice(0,10)};
const fdate=d=>d?new Date(d+'T12:00:00Z').toLocaleDateString('es-AR',{day:'numeric',month:'short',timeZone:'UTC'}):'';
const fts=ts=>ts?new Date(ts).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:TZ}):'';

function agg(list){
  const m={};let merc=0,cost=0,envio=0;
  list.forEach(o=>{merc+=o.merc;envio+=o.envio;o.items.forEach(i=>{const x=m[i.c]||(m[i.c]={c:i.c,n:i.n,q:0,rev:0,cost:0});x.q+=i.q;x.rev+=i.p*i.q;x.cost+=costOf(i)*i.q;cost+=costOf(i)*i.q})});

/* --- cierre de noche --- */
function cierreCalc(f){
  const L=ords().filter(o=>o.fecha===f);
  const vendido=sumBy(L,o=>o.total),conf=L.filter(o=>cobroOf(o)==='confirmado'),pend=L.filter(o=>cobroOf(o)!=='confirmado');
  const compras=Object.values(R.compras).filter(c=>c.fecha===f),gastos=Object.values(R.gastos).filter(g=>g.fecha===f&&!g.anulado);
  const mv=Object.values(R.moves).filter(m=>m.fecha===f&&m.d<0&&m.tipo!=='deshacer');
  const unidades=sumBy(L,o=>sumBy(o.items,i=>i.q)),costo=sumBy(L,o=>orderCost(o));
  const dif=[];
  const sinEntregar=L.filter(o=>o.estado!=='entregado'&&o.estado!=='problema').length,prob=L.filter(o=>o.estado==='problema').length;
  if(sinEntregar)dif.push(sinEntregar+(sinEntregar>1?' pedidos sin entregar':' pedido sin entregar'));
  if(prob)dif.push(prob+(prob>1?' pedidos con problema':' pedido con problema'));
  if(pend.length)dif.push(pend.length+' sin confirmar el cobro ('+money(sumBy(pend,o=>o.total))+')');
  const venc=Object.values(P).reduce((a,p)=>a+lotsOf(p.c).filter(l=>lotState(l)==='vencido').length,0);
  if(venc)dif.push(venc+(venc>1?' lotes vencidos sin dar de baja':' lote vencido sin dar de baja'));
  return{fecha:f,pedidos:L.length,vendido:vendido,cobrado:sumBy(conf,o=>o.total),porCobrar:sumBy(pend,o=>o.total),
    gastado:sumBy(compras,c=>c.total)+sumBy(gastos,g=>g.monto),compras:sumBy(compras,c=>c.total),gastos:sumBy(gastos,g=>g.monto),
    unidades:unidades,costoStock:Math.round(costo),mermas:sumBy(mv,m=>-m.d),mermasCosto:sumBy(mv,m=>m.costo),dif:dif};
}

async function cpSave(){
