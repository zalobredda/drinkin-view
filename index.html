const dscP=()=>+C.descuento||0;
function pcRows(){
  const list=ords(),a=agg(list),vals=Object.values(a.m);
  const qs=vals.map(x=>x.q).sort((x,y)=>x-y),pcts=vals.map(x=>x.rev?(x.rev-x.cost)/x.rev:0).sort((x,y)=>x-y);
  const hiQ=qs.length?qs[Math.floor(qs.length*2/3)]:Infinity,loP=pcts.length?pcts[Math.floor(pcts.length/3)]:-1;
  return Object.values(P).filter(p=>p.p>0).map(p=>{
    const kr=lastCost(p.c),dp=p.p*(1-dscP()/100),x=a.m[p.c];
    const real=x?{un:(x.rev-x.cost)/x.q,pct:x.rev?(x.rev-x.cost)/x.rev*100:0,q:x.q}:null;
    const pct=dp?(dp-kr)/dp*100:0;
    return{p:p,kr:kr,m:dp-kr,pct:pct,solo:p.p-kr,real:real,low:pct<(+C.pisoPct||0),mucho:!!(real&&real.q>=hiQ&&real.pct/100<=loP)};

}
function pcCombos(){

    const its=comboScaled(o,cb,o.per),sub=sumBy(its,i=>P[i.c].p*i.q),price=its.length>=2?sub*(1-dscP()/100):sub,cost=sumBy(its,i=>lastCost(i.c)*i.q);
    return{o:o,cb:cb,price:Math.round(price),cost:Math.round(cost),m:Math.round(price-cost),pct:price?(price-cost)/price*100:0};
  }));
}
function simPrice(p){
  const s=S.g.pr||{};let pct=null;
  if(s.prod&&s.prod===p.c&&s.prodv!=='')pct=+s.prodv;
  else if(s.cat&&s.cat===p.cat&&s.catv!=='')pct=+s.catv;

function eqNights(){const ds=[...new Set(ords().map(o=>o.fecha))].sort();return ds.slice(-Math.max(1,+C.nochesReal||7))}
function ordMerc(o,pm){
  if(!pm||!Object.keys(pm).length)return o.merc;
  const sub=sumBy(o.items,i=>{const f=pm[i.c]&&P[i.c]&&P[i.c].p?pm[i.c]/P[i.c].p:1;return i.p*f*i.q});
  return o.items.length>=2?sub*(1-dscP()/100):sub;
}
function eqCalc(opt){
  opt=opt||{};const ds=eqNights();if(!ds.length)return null;
  const set=new Set(ds),list=ords().filter(o=>set.has(o.fecha)),e=S.team.eq,f=1+(opt.pct||0)/100,n=list.length,pl=(e.plat/100)*(C.comision/100);
  let merc=0,cost=0,env=0;
  list.forEach(o=>{merc+=ordMerc(o,opt.pm)*f;cost+=orderCost(o);env+=o.envio});
  const m0=merc/n,kc=cost/n,ev=e.env?env/n:0,contrib=m0-kc+ev-m0*pl,pct=m0?(m0-kc)/m0:0,minM=+C.minimo||0,worst=minM*pct-minM*pl;
  const fixed=sumBy(C.costos,c=>c.v)+(+C.regaloPresu||0),perNight=fixed/(+C.noches||1),piso=perNight+(+C.gananciaNoche||0),need=x=>x>0?piso/x:Infinity;
  const nights=ds.map(d=>{const L=list.filter(o=>o.fecha===d);return{d:d,n:L.length,m:sumBy(L,o=>{const mm=ordMerc(o,opt.pm)*f;return mm-orderCost(o)+(e.env?o.envio:0)-mm*pl})}});
  const avgNight=sumBy(nights,x=>x.m)/nights.length;
  return{ds:ds,n:n,m0:m0,kc:kc,ev:ev,com:m0*pl,contrib:contrib,pct:pct*100,worst:worst,needReal:need(contrib),needWorst:need(worst),fixed:fixed,perNight:perNight,piso:piso,nights:nights,avgNight:avgNight,cover:avgNight/piso,pedNoche:n/ds.length};
}

function rdDev(r,L){
  // costo devengado: por entrega = tarifa × entregas; por turno = tarifa × (noche, momento) distintos
  const t=+r.tarifa||0;
  if(r.pago==='turno'){const set=new Set(L.map(o=>o.fecha+'|'+((C.turnos.find(x=>x.h===o.turno)||{}).m||'Noche')));return set.size*t}
  return L.length*t;
}
/* historial de un rider día por día: cada día se abre para ver sus pedidos, tiempos y observaciones */
function rdHist(r){
  const mine=ordsAll().filter(o=>o.rider===r.n&&o.fecha),dias=[...new Set(mine.map(o=>o.fecha))].sort().reverse().slice(0,30),ab=S.g.rd.dia||{};
  if(!dias.length)return pn('Historial de '+esc(r.n),'',`<div class="pn-b"><p class="help" style="margin:0">Todavía no tiene pedidos asignados.</p></div>`);
  const hm=t=>t?hhmm(t):'—';
  const rows=dias.map(d=>{
    const L=mine.filter(o=>o.fecha===d).sort((a,b)=>(a.tRetiro||0)-(b.tRetiro||0)),E=L.filter(o=>o.estado==='entregado'),P=L.filter(o=>o.estado==='problema'||(o.obs||[]).length).length;
    const tt=E.filter(o=>o.tRetiro&&o.tEntrega).map(o=>(o.tEntrega-o.tRetiro)/60000),on=ab[d];
    const head=`<tr class="dia" data-act="rddia" data-d="${d}" style="cursor:pointer"><td><b class="st-t">${on?'▾ ':'▸ '}${dayLabel(d)}</b></td><td class="r num">${E.length}${L.length>E.length?' de '+L.length:''}</td><td class="r num">${tt.length?Math.round(sumBy(tt,x=>x)/tt.length)+' min':'—'}</td><td class="r num">${money(rdDev(r,E))}</td><td>${P?stg(P+' con novedad','warn'):''}</td></tr>`;
    const det=on?L.map(o=>`<tr class="hij"><td style="padding-left:28px"><b class="st-t">${esc(first(o.nombre))}</b><div class="small muted">${esc(o.code)} · ${esc(o.barrio||'')} · ${esc(estTxt(o))}</div>${(o.obs||[]).map(x=>`<div class="small">“${esc(x.txt)}” · ${hhmm(x.ts)}</div>`).join('')}${o.problema?`<div class="small">Problema: ${esc(o.problema.motivo)}</div>`:''}</td><td class="r num">retiró ${hm(o.tRetiro)}</td><td class="r num">entregó ${hm(o.tEntrega)}</td><td class="r num">${money(o.total)}</td><td></td></tr>`).join(''):'';
    return head+det;
  }).join('');
  return pn('Historial de '+esc(r.n),'Día por día · tocá un día para ver sus pedidos',`<table class="tbl"><thead><tr><th>Día</th><th class="r">Entregas</th><th class="r">Tiempo medio</th><th class="r">Devengado</th><th></th></tr></thead><tbody>${rows}</tbody></table>`);
}
async function rdPay(i){

function setPath(o,path,v){const k=path.split('.');let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v}
function cfgChange(t){
  const path=t.dataset.cfg;let v=t.value;
  if(t.dataset.t==='num'){v=+v;if(!isFinite(v)||v<0){toast('Ese valor no sirve');render();return}}
  if(t.dataset.t==='time'&&!/^\d{1,2}:\d{2}$/.test(v)){toast('Poné la hora como 19:15');render();return}
  if(isPinPath(path)&&!/^\d{4}$/.test(v)){toast('La clave tiene que ser de 4 números');render();return}
  if(isPinPath(path)&&pinTaken(v,path)){toast('Esa clave ya la usa otra persona');render();return}
  if(path==='whatsapp')v=digits(v);
  const clone=JSON.parse(JSON.stringify(C)),before=getPath(C,path),secret=isPinPath(path);
  setPath(clone,path,v);
  guard(async()=>{await dbSet('config/main',clone);await logChange('config',secret?'Cambió una clave (no se muestra)':'Cambió '+cfgName(path),secret?[]:[{k:'cfg',f:path,a:before,d:v}],secret?{noUndo:true}:undefined)}).then(ok=>{if(ok)toast('Guardado')});
}
const CFGN={minimo:'el pedido mínimo',descuento:'el descuento de combo',envioCerca:'el envío cercano',envioLejos:'el envío lejano',stockBajo:'el aviso de stock bajo',comision:'la comisión de plataformas',noches:'las noches de trabajo',regaloPresu:'el presupuesto de regalos',regaloHabitue:'el costo del regalo habitué',vencDias:'los días de “por vencer”',ventanaDias:'los días de la ventana de regalo',pisoPct:'el piso de margen',gananciaNoche:'la ganancia buscada por noche',nochesReal:'las noches del margen real',mpComision:'la comisión de Mercado Pago',redondeo:'el redondeo de precios',whatsapp:'el WhatsApp del negocio',alias:'el alias de pago',cbu:'el CBU',vasosPorPersona:'los vasos por persona',vasosMax:'el máximo de vasos'};
const isPinPath=p=>p==='pin'||/^(riders|personas)\.\d+\.pin$/.test(p);
function pinTaken(v,path){
  if(path!=='pin'&&v===String(C.pin))return true;
  if(path==='pin'&&((C.riders||[]).concat(C.personas||[])).some(x=>String(x.pin)===v))return true;
  return (C.riders||[]).some((r,i)=>String(r.pin)===v&&path!=='riders.'+i+'.pin')||(C.personas||[]).some((r,i)=>String(r.pin)===v&&path!=='personas.'+i+'.pin');
}
const confirmLast=()=>{toast('Tiene que quedar al menos una persona con clave propia',true);return false};
function cfgName(p){
  if(CFGN[p])return CFGN[p];
  let m=p.match(/^costos\.(\d+)\.(n|v)$/);if(m&&C.costos[+m[1]])return 'el costo fijo “'+C.costos[+m[1]].n+'”'+(m[2]==='n'?' (nombre)':'');
  m=p.match(/^personas\.(\d+)\.(\w+)$/);if(m&&(C.personas||[])[+m[1]])return 'a '+C.personas[+m[1]].n+' ('+({n:'nombre'}[m[2]]||m[2])+')';
  m=p.match(/^riders\.(\d+)\.(\w+)$/);if(m&&(C.riders||[])[+m[1]])return 'el rider '+C.riders[+m[1]].n+' ('+({n:'nombre',pago:'forma de pago',tarifa:'tarifa'}[m[2]]||m[2])+')';
  m=p.match(/^turnos\.(\d+)\.(\w+)$/);if(m&&C.turnos[+m[1]])return 'el turno de las '+C.turnos[+m[1]].h+' ('+m[2]+')';
  m=p.match(/^zonas\.(\d+)\./);if(m&&C.zonas[+m[1]])return 'la zona '+C.zonas[+m[1]].n;
  return p;
}
function prodChange(t){
  const [c,f]=t.dataset.prod.split('.'),p=P[c];if(!p)return;
  if(t.type==='checkbox'){guard(async()=>{await dbSet('products/'+c,Object.assign({},p,{[f]:t.checked}));await logChange('stock',(t.checked?'Tachó ':'Destachó ')+p.n,[{k:'set',p:'products/'+c,f:f,a:!!p[f],d:t.checked}])}).then(ok=>{if(ok)toast(t.checked?'Tachado':'Disponible de nuevo')});return}
  const v=+t.value;
  if(f==='r'){
    if(!isFinite(v)||v<=0||v>=95){toast('Poné una rentabilidad entre 1 y 94 %',true);render();return}
    if(!(p.k>0)){toast('Primero cargá el costo de este producto',true);render();return}
    const rr=+C.redondeo||1,np=Math.max(rr,Math.round(p.k/(1-v/100)/rr)*rr);
    if(np===p.p){render();return}
    guard(async()=>{await dbSet('products/'+c,Object.assign({},p,{p:np}));await logChange('precio','Precio de '+p.n+' por rentabilidad de '+v+' %',[{k:'set',p:'products/'+c,f:'p',a:p.p,d:np}])}).then(ok=>{if(ok){toast('Precio nuevo: '+money(np)+' ('+(Math.round((np-p.k)/np*1000)/10)+' % de rentabilidad)');render()}else render()});return;
  }
  if(!isFinite(v)||v<0){toast('Ese valor no sirve');render();return}
  const nv=Math.round(v);
  if(f==='s'){const d=nv-(p.s||0);if(!d)return;if(!chkOpen(today(),'el stock')){render();return}guard(()=>stockMove(c,d,{tipo:'ajuste',motivo:'ajuste manual'})).then(ok=>{if(ok)toast('Guardado');else render()});return}
  guard(async()=>{await dbSet('products/'+c,Object.assign({},p,{[f]:nv}));await logChange(f==='p'?'precio':'costo',(f==='p'?'Precio':'Costo')+' de '+p.n,[{k:'set',p:'products/'+c,f:f,a:p[f],d:nv}])}).then(ok=>{if(ok){const nn=P[c],rp=nn&&nn.p>0?Math.round((nn.p-nn.k)/nn.p*1000)/10:null;toast('Guardado'+(rp!=null&&(f==='p'||f==='k')?' · rentabilidad '+rp+' %':''));render()}});
}
function teamAct(a,el,ev){

    case 'sel':S.team.sel=d.code;S.team.anul=null;render();break;
    case 'tt':S.team.tt=d.v;render();break;
    case 'adv':{const o=R.orders[d.code];if(!o)break;const nx={recibido:'preparando',preparando:'camino',camino:'entregado'}[o.estado];if(!nx)break;const p={estado:nx},now=Date.now();if(nx==='camino'&&!o.tRetiro)p.tRetiro=now;if(nx==='entregado'){p.tEntrega=now;if(!o.tRetiro)p.tRetiro=now}guard(async()=>{await patchOrder(o.code,p);await logChange('pedido',o.code+' pasó a '+(EST[nx]||nx),[],{noUndo:true})});break}

    case 'prob':{const o=R.orders[d.code];if(o)guard(()=>patchOrder(o.code,{estado:'problema',problema:{motivo:'Marcado desde la base',ts:Date.now(),rider:o.rider||''}}));break}
    case 'asg':S.sheet={t:'rider',code:d.code};renderSheet();break;
    case 'dorider':{const o=R.orders[d.code];S.sheet=null;if(o)guard(async()=>{await patchOrder(o.code,{rider:d.n||''});await logChange('pedido',d.n?o.code+' asignado a '+d.n:o.code+': se sacó el rider',[],{noUndo:true})}).then(ok=>{if(ok)toast(d.n?'Asignado a '+d.n:'Rider quitado')});render();break}
    case 'sticker':S.sheet={t:'sticker',code:d.code};renderSheet();break;
    case 'avsent':{const o=R.orders[d.code];if(o)guard(()=>patchOrder(o.code,{avisos:(o.avisos||[]).map((a,i)=>i===+d.i?Object.assign({},a,{env:true}):a)}));break}
    case 'skin':savePrefs({skin:d.v});render();break;
    case 'peradd':saveCfg({personas:(C.personas||[]).concat([{id:'p'+Date.now().toString(36),n:'Nueva persona',pin:(()=>{let c;do{c=String(1000+Math.floor(Math.random()*9000))}while(pinTaken(c,''));return c})(),admin:false}])});break;
    case 'perad':{const ps=JSON.parse(JSON.stringify(C.personas||[])),x=ps[+d.i];if(!x)break;x.admin=!x.admin;saveCfg({personas:ps}).then(ok=>{if(ok)logChange('config',(x.admin?'Dio permiso de administrador a ':'Sacó el permiso de administrador a ')+x.n,[],{noUndo:true})});break}
    case 'perbaja':case 'perrest':{const baja=a==='perbaja',ps=JSON.parse(JSON.stringify(C.personas||[])),x=baja?ps[+d.i]:ps.find(y=>y.id===d.id);if(!x)break;if(baja&&ps.filter(y=>!y.baja).length<=1&&!confirmLast()){break}x.baja=baja;saveCfg({personas:ps}).then(ok=>{if(ok){logChange('config',(baja?'Dio de baja a ':'Restauró a ')+x.n,[],{noUndo:true});toast(baja?x.n+' quedó de baja. Se restaura desde acá.':x.n+' está de vuelta')}});break}
    case 'addrider':saveCfg({riders:(C.riders||[]).concat([{id:'r'+Date.now().toString(36),n:'Nuevo rider',pin:String(1000+Math.floor(Math.random()*9000))}])});break;
    case 'delrider':case 'rdrestore':{const baja=a==='delrider',rs=JSON.parse(JSON.stringify(C.riders||[])),r=rs[+d.i];if(!r)break;r.baja=baja;saveCfg({riders:rs}).then(ok=>{if(ok){if(baja)logChange('config','Dio de baja al rider '+r.n,[{k:'rider',id:r.id,f:'baja',a:false,d:true}],{borra:true});else{Object.values(R.cambios).filter(c=>!c.undone&&(c.ops||[]).some(o=>o.k==='rider'&&o.id===r.id&&o.d===true)).forEach(c=>dbSet('cambios/'+c.id,Object.assign({},c,{undone:true,undoneBy:me(),undoneTs:Date.now()})));logChange('config','Restauró al rider '+r.n,[],{noUndo:true})}toast(baja?r.n+' quedó de baja. Lo recuperás en Gestión › Riders.':r.n+' está de vuelta')}});break}
    case 'tab':S.team.tab=d.v;render();window.scrollTo(0,0);break;

    case 'reset':resetDemo();break;
  }

async function boot(){
  rebuild();render();
  try{USER=window.claude&&await window.claude.use('user')}catch(e){}
  try{DB=window.claude&&await window.claude.use('db')}catch(e){DB=null}
  try{S.canEdit=!!(USER&&await USER.canEdit())}catch(e){}
  try{S.isOwner=!!(USER&&await USER.isOwner())}catch(e){}
  try{S.uid=USER?await USER.id():null}catch(e){}
  loadSess();if(S.role)loadPrefs();
  if(!DB){
    // sin base compartida: la app funciona con el catálogo del archivo y datos de muestra locales
    S.localMode=true;seedLocal(RR);if(S.ens)seedLocal(RE);
    rebuild();render();return;
  }
  attach(false);if(S.ens)ensAttachOnce();
}
function attach(ens){
  const st=ens?RE:RR,fl=ens?flagsE:flags,pf=ens?'ens_':'';
  const fail=e=>{console.error(e)};
  const done=k=>{fl[k]=1;if(st===R){rebuild();softRender()}maybeSeed()};
  DB.doc(pf+'config/main').onSnapshot(s=>{st.cfg=s.exists?s.data():null;done('cfg')},fail);
  DB.collection(pf+'products').onSnapshot(s=>{st.prods={};s.docs.forEach(d=>st.prods[d.id]=d.data());done('prods')},fail);
  DB.collection(pf+'orders').orderBy('ts','desc').limit(600).onSnapshot(s=>{st.orders={};s.docs.forEach(d=>st.orders[d.id]=d.data());done('orders')},fail);
  DB.collection(pf+'customers').onSnapshot(s=>{st.cust={};s.docs.forEach(d=>st.cust[d.id]=d.data());done('cust')},fail);
  COLS.forEach(k=>DB.collection(pf+k).orderBy('ts','desc').limit(COLLIM[k]).onSnapshot(s=>{st[k]={};s.docs.forEach(d=>st[k][d.id]=d.data());if(st===R)softRender()},fail));
}
function maybeSeed(){
  const e=S.ens,fl=e?flagsE:flags;
  if((e?S.seedDoneE:S.seedDone)||!(fl.cfg&&fl.prods&&fl.orders&&fl.cust))return;
  if(e)S.seedDoneE=true;else S.seedDone=true;
  if(!R.cfg&&!Object.keys(R.prods).length&&!Object.keys(R.orders).length&&S.canEdit&&!S.seeding)runSeed();
}
boot();
</script>
